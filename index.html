<style>

*{box-sizing:border-box}

/* HUD и кнопки (аудит v0.2): значок уровня, плашка счётчика, круглые кнопки с иконками. CSS — только на UI-слое (§9). */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px 6px;pointer-events:none;background:var(--hud-bg);color:#fff}

footer{display:flex;gap:14px;justify-content:center;align-items:center;padding:8px 14px calc(12px + env(safe-area-inset-bottom));background:var(--foot-bg)}
.fbtn{height:56px;min-width:56px;border-radius:28px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:800;font-size:16px;
  transition:transform .06s} .fbtn:active{transform:translateY(2px) scale(.96)}
.fbtn.blue{background:linear-gradient(#5aa8ff,#2f7ef0);box-shadow:0 4px 0 #1f5cb8} .fbtn.orange{background:linear-gradient(#ffb547,#ff8a1c);box-shadow:0 4px 0 #c45f00}
.fbtn.purple{background:linear-gradient(#a879ff,#7c4ff0);box-shadow:0 4px 0 #5530b8} .fbtn.blue{min-width:150px}

  animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}

<!-- three.js 0.185.1, вендорен файлом vendor/three.js (CJS-сборка в обёртке-функции → window.THREE). CDN не используется. -->
<script src="vendor/three.js"></script>
<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Пена в ванне». Пузыри стоят столбиками (снизу вверх), в пузыре до CFG.CAP игрушек.
// Тап по пузырю — он лопается, его игрушки падают в ближний пузырь ниже в том же столбике.
//   влезли  → остаются; три одинаковых в пузыре — пузырь улетает вместе с ними;
//   не влезли → нижний лопается от тяжести, всё падает дальше (цепочка);
//   ниже пузырей нет → игрушки в общий стаканчик; там тройка тоже улетает; больше cap — проигрыш.
// Двойной пузырь (hard): первый тап снимает внешнюю плёнку (игрушки на месте), тяжесть сверху лопает его сразу.
// Победа — игрушек не осталось нигде. Проигрыш — стаканчик переполнен.
// Ход кодируется числом m = столбик * 16 + номер пузыря снизу.
// ---------------------------------------------------------------------------
const CFG = {
  CAP: 3,                 // мест в пузыре
  MATCH: 3,               // столько одинаковых игрушек улетают (в пузыре и в стаканчике)
  CUP_CAP: 4,             // мест в стаканчике по умолчанию (уровень переопределяет полем cup)
  AIR_MATCH: true,        // в цепочке тройка одинаковых улетает прямо на лету, остаток падает дальше и может влезть
  GEN_TRIES: 120,         // попыток генератора на уровень (сид от номера уровня, поток детерминирован)
  BOT_RUNS: 80,           // прогонов бота-новичка при отборе уровня
  SOLVER_MAX: 150000,     // предел состояний поиска в ширину (защита от зависания)
  // Кадры анимации хода, мс (делятся на timeScale)
  T_POP: 110,             // пузырь лопнул, игрушки повисли
  T_FALL: 240,            // игрушки долетели до пузыря ниже
  T_FLY: 380,             // тройка в пузыре улетает
  T_CUP: 300,             // кучка долетела до места над стаканчиком
  T_CUP_STEP: 170,        // одна игрушка опускается в гнездо (по очереди)
  T_CLEAR: 320,           // тройка в стаканчике улетает
  T_OVER: 420,            // стаканчик переполнился
  END_DELAY: 550,         // пауза между последним кадром и экраном победы/поражения
  TOAST_MS: 2400,         // сколько висит тост
  JELLY_MS: 480,          // «желе» пузыря и сплющивание игрушки после приземления, мс
  STAR2_SLACK: 2,         // звёзды: тапов ≤ par → 3, ≤ par + STAR2_SLACK → 2, иначе 1
};
const KIND_NAMES = ['утёнок', 'кит', 'рыбка', 'лягушка', 'кораблик', 'звезда'];

// Контент — декларативная таблица. layout — ручной уровень (столбики снизу вверх; буква = игрушка A..F,
// '#' в начале — двойной пузырь, '' — пустой). Иначе — генератор по параметрам:
//   cols — столбиков, maxH — потолок высоты столбика, kinds — видов игрушек, per — игрушек каждого вида (кратно 3),
//   pure — сколько троек лежат «чистыми» кусками в одном столбике, empty — пустых пузырей, hard — двойных, spread — доля чистых кусков, разбросанных по столбику поодиночке,
//   cup — мест в стаканчике, minPar — минимум тапов в лучшем решении,
//   nov — минимум побед бота-новичка, rnd — потолок побед случайного бота (ввод должен быть важен),
//   minTri — сколько троек в пузыре новичок должен собирать в среднем, chain — лучшее решение обязано содержать цепочку.
const LEVELS = [
  { n: 1, layout: [['AA', 'A'], ['BB', 'B']], cup: 4, hint: true,
    tip: 'Лопни верхний пузырь' },
  { n: 2, layout: [['A', 'BB', 'AA'], ['B']], cup: 4, hint: true,
    tip: 'Перегруз лопает пузырь ниже' },
  { n: 3, cols: 3, maxH: 3, kinds: 2, per: 3, pure: 1, empty: 1, cup: 4, minPar: 3, nov: 0.9, rnd: 1.0, minTri: 0.5,
    tip: 'Лишнее падает в мыльницу — не переполни' },
  { n: 4, cols: 3, maxH: 3, kinds: 3, per: 3, pure: 2, spread: 0.5, empty: 0, cup: 3, minPar: 4, nov: 0.8, rnd: 0.6, minTri: 1, chain: true },
  { n: 5, cols: 4, maxH: 3, kinds: 4, per: 3, pure: 2, spread: 0.5, empty: 1, cup: 3, minPar: 5, nov: 0.75, rnd: 0.5, minTri: 1, chain: true },
  { n: 6, cols: 3, maxH: 4, kinds: 3, per: 3, pure: 2, spread: 0.5, empty: 0, hard: 1, cup: 3, minPar: 4, nov: 0.75, rnd: 0.5, minTri: 1,
    tip: 'Двойной пузырь: первый тап снимает плёнку' },
  { n: 7, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 3, spread: 0.6, empty: 1, hard: 1, cup: 3, minPar: 5, nov: 0.7, rnd: 0.45, minTri: 1.5, chain: true },
  { n: 8, cols: 4, maxH: 4, kinds: 3, per: 6, pure: 3, spread: 0.6, empty: 0, hard: 1, cup: 3, minPar: 6, nov: 0.65, rnd: 0.4, minTri: 1.5, chain: true },
  { n: 9, cols: 5, maxH: 4, kinds: 5, per: 3, pure: 3, spread: 0.7, empty: 1, hard: 2, cup: 3, minPar: 6, nov: 0.6, rnd: 0.35, minTri: 1.5, chain: true },
  { n: 10, cols: 5, maxH: 4, kinds: 6, per: 3, pure: 4, spread: 0.7, empty: 0, hard: 2, cup: 3, minPar: 7, nov: 0.55, rnd: 0.3, minTri: 2, chain: true },
];

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(a, rnd){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// Раскладка без id: [[{hard, k:[виды]}…]…] — столбики снизу вверх.
function parseLayout(rows){
  return rows.map(col => col.map(str => ({ hard: str[0] === '#', k: str.replace('#', '').split('').map(ch => ch.charCodeAt(0) - 65) })));
}
function cloneLayout(lay){ return lay.map(col => col.map(b => ({ hard: b.hard, k: b.k.slice() }))); }
function layoutToState(li, lay, cap, par){
  let nid = 1;
  const cols = lay.map(col => col.map(b => ({ id: nid++, hard: b.hard, toys: b.k.map(k => ({ id: nid++, k })) })));
  return { li, cols, cup: [], cap, moves: 0, par, prev: null, lost: false, why: '',
           triples: 0, cupClears: 0, airTriples: 0, chains: 0, lastChain: 0, maxChain: 0, cupMax: 0 };
}

// Генератор раскладки. Тройки делятся на «чистые» (pure штук: все три игрушки вида — в одном столбике, кусками
// 2+1, 1+2 или 1+1+1 в пузырях без чужих) и «россыпь» (игрушки перемешиваются и раскладываются пузырями по 1..CAP).
// Чистые куски кладутся подряд, россыпь и пустые пузыри вставляются в случайные места — так между кусками
// появляются помехи. Смешанный пузырь чистым уже не станет, поэтому тройка в пузыре возможна только из чистых кусков.
const SPLITS = [[2, 1], [1, 2], [2, 1], [1, 2], [1, 1, 1]];          // как резать чистую тройку (2+1 чаще)
const CHUNK = [1, 2, 2, 3, 3];                                       // размеры пузырей россыпи (полные чаще — больше цепочек)
function genLayout(L, rnd){
  const triples = [];
  for (let k = 0; k < L.kinds; k++) for (let t = 0; t < L.per / CFG.MATCH; t++) triples.push(k);
  shuffle(triples, rnd);
  const cols = Array.from({ length: L.cols }, () => []);
  const room = (c, n) => cols[c].length + n <= L.maxH;
  const pickCol = (n) => { const ok = cols.map((_, c) => c).filter(c => room(c, n)); return ok.length ? ok[Math.floor(rnd() * ok.length)] : -1; };
  const nPure = Math.min(L.pure || 0, triples.length);
  for (let j = 0; j < nPure; j++){
    const k = triples[j], split = SPLITS[Math.floor(rnd() * SPLITS.length)], c = pickCol(split.length);
    if (c < 0) return null;
    const pieces = split.map(n => ({ hard: false, k: new Array(n).fill(k) }));
    if (rnd() < (L.spread || 0)) for (const pc of pieces) cols[c].splice(Math.floor(rnd() * (cols[c].length + 1)), 0, pc);
    else cols[c].splice(Math.floor(rnd() * (cols[c].length + 1)), 0, ...pieces);
  }
  const loose = []; for (let j = nPure; j < triples.length; j++) for (let t = 0; t < CFG.MATCH; t++) loose.push(triples[j]);
  shuffle(loose, rnd);
  const chunks = [];
  for (let ti = 0; ti < loose.length;){
    const n = Math.min(loose.length - ti, CHUNK[Math.floor(rnd() * CHUNK.length)]), k = loose.slice(ti, ti + n); ti += n;
    if (n === CFG.MATCH && k.every(x => x === k[0])) return null;        // готовая тройка на старте — не годится
    chunks.push({ hard: false, k });
  }
  for (let e = 0; e < (L.empty || 0); e++) chunks.push({ hard: false, k: [] });
  shuffle(chunks, rnd);
  for (const ch of chunks){ const c = pickCol(1); if (c < 0) return null; cols[c].splice(Math.floor(rnd() * (cols[c].length + 1)), 0, ch); }
  if (cols.some(col => !col.length)) return null;
  const cand = [];                                                     // двойным делаем непустой пузырь, над которым что-то есть
  cols.forEach(col => col.forEach((b, i) => { if (i < col.length - 1 && b.k.length) cand.push(b); }));
  if (cand.length < (L.hard || 0)) return null;
  shuffle(cand, rnd);
  for (let i = 0; i < (L.hard || 0); i++) cand[i].hard = true;
  return cols;
}

// Уровень строится один раз и кешируется: ручной — как есть, генерируемый — первый подходящий из потока сида.
const LEVEL_CACHE = {};
function levelLayout(li){
  if (LEVEL_CACHE[li]) return LEVEL_CACHE[li];
  const L = LEVELS[li], cap = L.cup || CFG.CUP_CAP;
  if (L.layout){
    const lay = parseLayout(L.layout), s = layoutToState(li, lay, cap, 0), sol = solve(s);
    const st = noviceStats(s);
    return (LEVEL_CACHE[li] = { lay, par: sol ? sol.length : 0, rate: st.rate, random: randomRate(s), triples: st.triples, d: 0, tries: 0 });
  }
  const rnd = mulberry32(7919 * L.n + 13);
  let best = null;
  for (let t = 0; t < CFG.GEN_TRIES; t++){
    const lay = genLayout(L, rnd); if (!lay) continue;
    const s = layoutToState(li, lay, cap, 0);
    const sol = solve(s); if (!sol || sol.length < (L.minPar || 2)) continue;
    const st = noviceStats(s), rr = randomRate(s), sc = pathChains(s, sol);
    const d = Math.max(0, (L.nov || 0) - st.rate) + Math.max(0, rr - (L.rnd ?? 1))
            + Math.max(0, (L.minTri || 0) - st.triples) * 0.25           // мало троек в пузыре у новичка — штраф
            + (L.chain && !sc ? 0.3 : 0);                                // цепочка не нужна для лучшего решения — штраф
    if (!best || d < best.d) best = { lay, par: sol.length, rate: st.rate, random: rr, triples: st.triples, d, tries: t + 1 };
    if (d === 0) break;
  }
  return (LEVEL_CACHE[li] = best);
}
function createState(li){
  const g = levelLayout(li), L = LEVELS[li];
  return layoutToState(li, cloneLayout(g.lay), L.cup || CFG.CUP_CAP, g.par);
}

function cloneState(s){
  return { ...s, cols: s.cols.map(col => col.map(b => ({ id: b.id, hard: b.hard, toys: b.toys.slice() }))), cup: s.cup.slice() };
}
function toysLeft(s){ let n = s.cup.length; for (const col of s.cols) for (const b of col) n += b.toys.length; return n; }
function legalMoves(s){
  const out = []; if (s.lost) return out;
  s.cols.forEach((col, c) => col.forEach((b, i) => out.push(c * 16 + i)));
  return out;
}
function isWin(s){ return toysLeft(s) === 0; }
function isLose(s){ return s.lost; }

// Тройки одинаковых из набора игрушек (без изменения набора) — для «тройки на лету».
function takeTriples(toys){
  const by = {}, out = [];
  for (const t of toys) (by[t.k] = by[t.k] || []).push(t);
  for (const k in by) for (let q = 0; q + CFG.MATCH <= by[k].length; q += CFG.MATCH) out.push(...by[k].slice(q, q + CFG.MATCH));
  return out;
}
// Порядок, в котором кучка опускается в стаканчик: сначала игрушки видов, которые соберут тройку (больше своих
// уже в стаканчике — раньше), затем остальные; одинаковые подряд. Детерминированно.
function orderForCup(cup, falling){
  const cnt = {}, tot = {};
  for (const t of cup){ cnt[t.k] = (cnt[t.k] || 0) + 1; tot[t.k] = (tot[t.k] || 0) + 1; }
  for (const t of falling) tot[t.k] = (tot[t.k] || 0) + 1;
  const score = (t) => (tot[t.k] >= CFG.MATCH ? 100 : 0) + (cnt[t.k] || 0) * 10;
  return falling.slice().sort((a, b) => score(b) - score(a) || a.k - b.k);
}
// Игрушка встаёт в стаканчик рядом со своими (после последней такой же), иначе — в конец.
function insertGrouped(cup, toy){
  let at = -1; for (let i = 0; i < cup.length; i++) if (cup[i].k === toy.k) at = i;
  if (at < 0) cup.push(toy); else cup.splice(at + 1, 0, toy);
}
// Тройки в стаканчике улетают; возвращает улетевшие игрушки.
function clearCup(s){
  const gone = [];
  for (;;){
    const cnt = {}; let hit = -1;
    for (const t of s.cup){ cnt[t.k] = (cnt[t.k] || 0) + 1; if (cnt[t.k] >= CFG.MATCH){ hit = t.k; break; } }
    if (hit < 0) return gone;
    let left = CFG.MATCH;
    s.cup = s.cup.filter(t => { if (t.k === hit && left > 0){ left--; gone.push(t); return false; } return true; });
  }
}
// Снимок для анимации: оболочка тянет каждую игрушку и пузырь по id от снимка к снимку.
function snap(s, air, ev, dur){
  return { cols: s.cols.map(col => col.map(b => ({ id: b.id, hard: b.hard, toys: b.toys.slice() }))), cup: s.cup.slice(), cap: s.cap,
           air: air ? { c: air.c, at: air.at, cup: !!air.cup, toys: air.toys.slice() } : null, ev, dur };
}

// Ход. frames (необязательно) — сюда пишутся снимки для анимации. Нелегальный ход → null.
function applyMove(s, m, frames){
  const c = m >> 4, i = m & 15, col0 = s.cols[c];
  if (s.lost || !col0 || !col0[i]) return null;
  const n = cloneState(s); n.prev = s; n.moves++;
  const col = n.cols[c];
  if (col[i].hard){                                                    // двойной: тап снимает только плёнку
    col[i].hard = false; n.lastChain = 0;
    if (frames) frames.push(snap(n, null, [{ t: 'film', id: col[i].id }], CFG.T_POP));
    return n;
  }
  const b = col.splice(i, 1)[0];
  let falling = b.toys, j = i - 1, chain = 0;
  if (frames) frames.push(snap(n, falling.length ? { c, at: i, toys: falling } : null, [{ t: 'pop', id: b.id, chain: 0 }], CFG.T_POP));
  while (falling.length){
    if (j < 0){                                                        // ниже пузырей нет — в стаканчик
      // Кучка зависает над стаканчиком, игрушки опускаются по одной: каждая встаёт рядом со своими, три одинаковых
      // сразу улетают. Первыми идут те, что собирают тройку. Нет места и тройки не собрать — переполнение.
      let pend = orderForCup(n.cup, falling);
      if (frames) frames.push(snap(n, { cup: true, toys: pend }, [{ t: 'cupHover' }], CFG.T_CUP));
      while (pend.length){
        const toy = pend[0]; pend = pend.slice(1);
        insertGrouped(n.cup, toy); n.cupMax = Math.max(n.cupMax, n.cup.length);
        if (frames) frames.push(snap(n, pend.length ? { cup: true, toys: pend } : null, [{ t: 'cup', id: toy.id }], CFG.T_CUP_STEP));
        const gone = clearCup(n);
        if (gone.length){ n.cupClears += gone.length / CFG.MATCH; if (frames) frames.push(snap(n, pend.length ? { cup: true, toys: pend } : null, [{ t: 'cupClear', toys: gone }], CFG.T_CLEAR)); }
        if (n.cup.length > n.cap){ n.lost = true; n.why = 'cup'; n.overId = toy.id; if (frames) frames.push(snap(n, pend.length ? { cup: true, toys: pend } : null, [{ t: 'overflow', id: toy.id }], CFG.T_OVER)); break; }
      }
      break;
    }
    const tb = col[j];
    if (tb.toys.length + falling.length <= CFG.CAP){                   // влезли
      tb.toys = tb.toys.concat(falling);
      if (frames) frames.push(snap(n, null, [{ t: 'land', id: tb.id }], CFG.T_FALL));
      if (tb.toys.length === CFG.MATCH && tb.toys.every(t => t.k === tb.toys[0].k)){
        col.splice(j, 1); n.triples++;
        if (frames) frames.push(snap(n, null, [{ t: 'fly', id: tb.id, toys: tb.toys.slice(), k: tb.toys[0].k }], CFG.T_FLY));
      }
      break;
    }
    col.splice(j, 1); chain++;                                         // не влезли — лопается от тяжести
    falling = tb.toys.concat(falling);
    if (frames) frames.push(snap(n, { c, at: j, toys: falling }, [{ t: 'pop', id: tb.id, chain }], CFG.T_FALL));
    if (CFG.AIR_MATCH){
      const gone = takeTriples(falling); falling = falling.filter(t => !gone.includes(t));
      if (gone.length){ n.airTriples += gone.length / CFG.MATCH; if (frames) frames.push(snap(n, falling.length ? { c, at: j, toys: falling } : null, [{ t: 'airClear', toys: gone }], CFG.T_CLEAR)); }
    }
    j--;
  }
  n.lastChain = chain; n.chains += chain; n.maxChain = Math.max(n.maxChain, chain);
  return n;
}
function undoMove(s){ return s.prev || s; }

// Ключ состояния без id — для поиска.
function stateKey(s){
  return s.cols.map(col => col.map(b => (b.hard ? '#' : '') + b.toys.map(t => t.k).sort().join('')).join('.')).join('|')
    + '>' + s.cup.map(t => t.k).sort().join('');
}
// Поиск в ширину: кратчайшее по тапам решение (список ходов) или null.
function solve(s){
  if (isWin(s)) return [];
  const seen = new Set([stateKey(s)]); let layer = [{ s, path: [] }];
  while (layer.length){
    const next = [];
    for (const node of layer){
      for (const m of legalMoves(node.s)){
        const n = applyMove(node.s, m); if (n.lost) continue;
        const k = stateKey(n); if (seen.has(k)) continue; seen.add(k);
        const path = node.path.concat(m);
        if (isWin(n)) return path;
        n.prev = null; next.push({ s: n, path });
        if (seen.size > CFG.SOLVER_MAX) return null;
      }
    }
    layer = next;
  }
  return null;
}

// Боты (PROTO-BASE §6): случайный; новичок — не делает ход, проигрывающий сразу, и берёт любой ход, который что-то
// убирает, иначе случайный; жадный — максимум убранных игрушек за ход, при равенстве меньше в стаканчике.
function pickRandom(s, rnd){ const ms = legalMoves(s); return ms[Math.floor(rnd() * ms.length)]; }
function pickNovice(s, rnd){
  const left = toysLeft(s);
  const opts = legalMoves(s).map(m => { const n = applyMove(s, m); return { m, gain: left - toysLeft(n), lose: n.lost }; });
  const safe = opts.filter(o => !o.lose), pool = safe.length ? safe : opts;
  const good = pool.filter(o => o.gain > 0), from = good.length ? good : pool;
  return from[Math.floor(rnd() * from.length)].m;
}
function pickGreedy(s){
  let best = null, bs = -Infinity; const left = toysLeft(s);
  for (const m of legalMoves(s)){
    const n = applyMove(s, m), sc = n.lost ? -1000 : (left - toysLeft(n)) * 10 - n.cup.length;
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
function botRun(s, pick, seed){
  const rnd = mulberry32(seed); let chainTaps = 0;
  while (!isWin(s) && !isLose(s)){ s = applyMove(s, pick(s, rnd)); s.prev = null; if (s.lastChain > 0) chainTaps++; }
  return { win: isWin(s), moves: s.moves, par: s.par, why: s.why, chainTaps, triples: s.triples, cupClears: s.cupClears, airTriples: s.airTriples, cupMax: s.cupMax, maxChain: s.maxChain };
}
// Доля побед новичка и среднее число троек, собранных прямо в пузыре (главное «ага» механики).
function noviceStats(s0){
  let w = 0, tri = 0;
  for (let k = 0; k < CFG.BOT_RUNS; k++){ const r = botRun(s0, pickNovice, 500 + k); w += r.win ? 1 : 0; tri += r.triples; }
  return { rate: w / CFG.BOT_RUNS, triples: tri / CFG.BOT_RUNS };
}
// Сколько тапов лучшего решения запускают цепочку (лопанье от тяжести).
function pathChains(s, path){ let n = 0; for (const m of path){ s = applyMove(s, m); if (s.lastChain > 0) n++; } return n; }
function randomRate(s0){ let w = 0; for (let k = 0; k < CFG.BOT_RUNS; k++) w += botRun(s0, pickRandom, 900 + k).win ? 1 : 0; return w / CFG.BOT_RUNS; }
function randomRun(li, seed){ return botRun(createState(li), pickRandom, seed); }
function noviceRun(li, seed){ return botRun(createState(li), pickNovice, seed); }
function greedyRun(li){ return botRun(createState(li), pickGreedy, 1); }

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const Snd = {
  ac: null, noise: null,
  init(){
    if (!this.ac){
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        const len = Math.floor(this.ac.sampleRate * 0.3), buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0), r = mulberry32(99);
        for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
        this.noise = buf;
      } catch (e) { this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') try { this.ac.resume(); } catch (e) {}
  },
  ok(){ return this.ac && !G.save.muted; },
  tone(f0, f1, ms, type, vol, delay){                     // тон с глиссандо f0 → f1
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + ms / 1000);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + ms / 1000 + 0.03);
  },
  hiss(freq, ms, vol, delay){                             // шумовой «пшик» через полосовой фильтр
    if (!this.ok() || !this.noise) return;
    const ac = this.ac, t = ac.currentTime + (delay || 0), src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t + ms / 1000 + 0.02);
  },
  pop(chain){ const f = (700 + chain * 180) * (0.93 + 0.14 * Math.random()); this.hiss(f * 2.6, 55, 0.42); this.tone(f * 0.6, f * 1.5, 35, 'sine', 0.22); this.tone(f * 1.4, f * 0.5, 90, 'sine', 0.26, 0.03); log('sound', 'pop', 'chain=' + chain); },
  press(){ this.tone(200, 260, 50, 'sine', 0.08); },
  land(d){ this.tone(330, 180, 110, 'sine', 0.2, d); this.hiss(900, 70, 0.12, d); log('sound', 'land'); },
  fly(combo){ const up = Math.pow(1.122, Math.min(6, combo || 0)); [784, 988, 1319, 1568].forEach((f, i) => this.tone(f * up, f * up * 1.03, 160, 'triangle', 0.15, i * 0.055)); this.hiss(5200, 260, 0.08, 0.05); log('sound', 'fly', 'combo=' + (combo || 0)); },
  cup(d, n){ const f = 440 * Math.pow(1.19, (n || 1) - 1); this.tone(f, f * 0.8, 80, 'triangle', 0.16, d); log('sound', 'cup', 'n=' + (n || 1)); },
  whoosh(){ this.hiss(1500, 160, 0.08); },
  cupClear(){ [659, 880, 1175].forEach((f, i) => this.tone(f, f, 120, 'triangle', 0.15, i * 0.06)); log('sound', 'cupClear'); },
  thud(){ this.tone(150, 105, 120, 'sine', 0.32); log('sound', 'thud'); },
  over(){ this.tone(230, 110, 400, 'sawtooth', 0.11); log('sound', 'overflow'); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 220, 'sine', 0.2, i * 0.09)); log('sound', 'win'); },
  lose(){ [392, 330, 262].forEach((f, i) => this.tone(f, f * 0.97, 230, 'triangle', 0.16, i * 0.12)); log('sound', 'lose'); },
};
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// Тап по пузырю (c — столбик, i — номер снизу). Идущая анимация прошлого хода доигрывается мгновенно.
function tapBubble(c, i){
  if (!G.s || G.screen !== 'game' || G.ending) return;
  const b = G.s.cols[c] && G.s.cols[c][i]; if (!b) return;
  if (G.anim){ G.anim = null; log('fx.end', 'move', 'skipped'); }
  const frames = [snap(G.s, null, [], 0)];
  const n = applyMove(G.s, c * 16 + i, frames); if (!n) return;
  log('input', 'tap', 'c=' + c + ' i=' + i);
  G.s = n; G.hintMove = -1; buzz(10);
  startAnim(frames); hud();
  if (isWin(n)){ G.ending = G.anim.end + CFG.END_DELAY; log('event', 'level.win', 'moves=' + n.moves + ' par=' + n.par); }
  else if (isLose(n)){ G.ending = G.anim.end + CFG.END_DELAY; log('event', 'level.lose', 'why=' + n.why + ' moves=' + n.moves); }
}
function startAnim(frames){
  const t = now(), starts = [t]; let acc = t;
  for (let k = 1; k < frames.length; k++){ starts.push(acc); acc += frames[k].dur / G.timeScale; }
  G.anim = { frames, starts, end: acc, k: 0 }; G.combo = 0;
  log('fx.start', 'move', 'frames=' + (frames.length - 1));
}
// События кадра — звук, эффекты, журнал. Позиции берутся из предыдущего снимка (там пузырь ещё был).
function fireEvents(F, prevF){
  const lay = layoutFrame(prevF), t = now(), landAt = F.dur / G.timeScale, landSec = landAt / 1000;
  const landToys = (ids, at) => { for (const id of ids) G.squash[id] = at; };
  const say = (x, y, text, big) => G.fx.push({ type: 'text', x, y, text, big: !!big, t0: t, until: t + (big ? 1000 : 750) / G.timeScale });
  const triple = (x, y, label) => { G.combo++; if (G.combo >= 2) say(W / 2, y - GEO.r * 2.2, 'Комбо ×' + G.combo + '!', true); else say(x, y, label); };
  for (const e of F.ev){
    if (e.t === 'pop'){
      const p = lay.get(e.id); Snd.pop(e.chain); if (e.chain) buzz(12);
      if (p){
        if (!R3.ok) G.fx.push({ type: 'pop', x: p.x, y: p.y, r: p.s, t0: t, until: t + 360 / G.timeScale, chain: e.chain });
        spawnPop(p.x, p.y, p.s, e.chain);
        G.fx.push({ type: 'shake', amp: 1.5 + e.chain * 3, t0: t, until: t + 220 / G.timeScale });
        if (e.chain >= 2) say(p.x, p.y - p.s, 'цепочка ×' + (e.chain + 1));
      }
      log('event', 'pop', 'chain=' + e.chain);
    } else if (e.t === 'land'){
      G.wob[e.id] = t + landAt; Snd.land(landSec);
      for (const col of F.cols) for (const b of col) if (b.id === e.id) landToys(b.toys.map(x => x.id), t + landAt);
    } else if (e.t === 'film'){
      const p = lay.get(e.id); G.wob[e.id] = t; Snd.thud(); buzz(12);
      if (p){ if (!R3.ok) G.fx.push({ type: 'pop', x: p.x, y: p.y, r: p.s * 1.04, t0: t, until: t + 300 / G.timeScale, chain: 0 }); spawnPop(p.x, p.y, p.s * 1.04, 0); }
      log('event', 'film');
    } else if (e.t === 'fly'){
      const p = lay.get(e.id); Snd.fly(G.combo); buzz([10, 30, 10]);
      if (p){ if (R3.ok) spawnFlyer(p.x, p.y, p.s, e.k); else G.fx.push({ type: 'fly', x: p.x, y: p.y, r: p.s, k: e.k, t0: t, until: t + 700 / G.timeScale }); spawnSparks(p.x, p.y, 0, 14, 1); triple(p.x, p.y - p.s * 1.1, '×3'); }
      log('event', 'triple', 'kind=' + KIND_NAMES[e.k]);
    } else if (e.t === 'cupHover'){ Snd.whoosh(); }
    else if (e.t === 'cup'){
      Snd.cup(landSec, F.cup.length); landToys([e.id], t + landAt);
    } else if (e.t === 'airClear' || e.t === 'cupClear'){
      const air = e.t === 'airClear'; Snd.fly(G.combo); buzz([10, 30, 10]);
      // тройка съезжается к средней игрушке и лопается в одной точке — видно, что убрались именно эти три
      const mid = lay.get(e.toys[1].id) || lay.get(e.toys[0].id);
      for (const toy of e.toys){
        const p = lay.get(toy.id); if (!p) continue;
        if (R3.ok) spawnToyPop(p.x, p.y, p.z || 0, p.s, toy.k, mid.x, mid.y);
        else G.fx.push({ type: 'clear', x: p.x, y: p.y, s: p.s, k: toy.k, t0: t, until: t + 480 / G.timeScale });
      }
      if (mid) setTimeout(() => spawnSparks(mid.x, mid.y, mid.z || 0, 18, 1.1), 150 / G.timeScale);
      const p0 = mid;
      if (p0) triple(air ? W / 2 : p0.x, air ? p0.y - GEO.r * 1.9 : GEO.cupY - GEO.cupH * 0.8, air ? '×3 на лету!' : '×3');
      log('event', air ? 'air.triple' : 'cup.clear', 'kind=' + KIND_NAMES[e.toys[0].k]);
    } else if (e.t === 'overflow'){
      Snd.over(); buzz(80); G.fx.push({ type: 'shake', amp: 10, t0: t, until: t + 480 / G.timeScale });
      log('event', 'overflow');
    }
  }
}
function finishEnding(){
  G.ending = 0;
  if (isWin(G.s)){
    const li = G.s.li, m = G.s.moves, p = G.s.par;
    const stars = m <= p ? 3 : m <= p + CFG.STAR2_SLACK ? 2 : 1;
    G.save.best[li] = Math.max(G.save.best[li] || 0, stars);
    G.save.level = Math.max(G.save.level, Math.min(li + 1, LEVELS.length - 1)); save();
    Snd.win(); buzz([20, 40, 20]); spawnConfetti(V3.CONFETTI);
    log('event', 'reward', 'stars=' + stars);
    goto('win', { stars: starStr(stars), text: 'Тапов: ' + m + ' · лучший путь: ' + p + (G.s.maxChain ? ' · цепочка ×' + (G.s.maxChain + 1) : '') });
  } else { Snd.lose(); goto('lose'); }
}
function undo(){
  if (!G.s || !G.s.prev) return;
  G.s = undoMove(G.s); G.anim = null; G.ending = 0; G.fx = []; log('input', 'undo'); hud();
}

// --- геометрия: виртуальная ширина VW, всё в виртуальных юнитах (§2) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = 400;
let scale = 1, W = VW, H = 600, DPR = 1, GEO = null;
function computeGeo(){
  const nc = G.s ? G.s.cols.length : 3;
  const cupH = 84, cupY = H - 14 - cupH / 2;                  // центр мыльницы
  const waterY = cupY - cupH / 2 - 32;                        // поверхность воды
  const colW = Math.min(124, (W - 14) / nc);
  let r = Math.min(58, colW * 0.47);                          // пузыри крупнее: поле занимает всю высоту
  r = Math.min(r, (waterY - 80) / (G.maxH * 1.8 + 0.2));      // сверху запас под всплывающие подписи
  const step = r * 1.8;                                       // шаг пузырей в столбике (лёгкое перекрытие пены)
  return { nc, colW, r, step, waterY, baseY: waterY - r - 10, cupY, cupH };   // низ пузыря на 10 px выше воды и пены
}
function bubbleXY(c, i){ return { x: W / 2 + (c - (GEO.nc - 1) / 2) * GEO.colW, y: GEO.baseY - i * GEO.step }; }
const TOY_K = 0.38;                                         // размер игрушки в долях радиуса пузыря (когда их три)
const TOY_BY_N = [0, 0.46, 0.38, 0.28];                     // одна ≈0,62 D, две ≈0,44 D, три ≈0,36 D (видимый размер = TOY_FIT × s)
// Места игрушек внутри пузыря (доли радиуса): 1, 2 или 3 штуки.
const SLOT_OFS = [[], [[0, 0.04]], [[-0.45, 0.08], [0.45, 0.08]], [[-0.4, 0.26], [0.4, 0.26], [0, -0.33]]];
// Гнёзда мыльницы: ровно cap мест, позиции не зависят от числа игрушек (игрушка всегда встаёт в своё гнездо).
// hoverY — ряд над мыльницей: там висит падающая кучка и лишняя игрушка при переполнении.
function cupSlots(n, cap){
  const sw = Math.min(78, (W - 60) / cap), w = cap * sw + 34, x0 = W / 2 - (cap * sw) / 2;
  return { w, sw, x: (i) => x0 + sw * (i + 0.5), y: GEO.cupY, s: sw * 0.29, hoverY: GEO.cupY - GEO.cupH * 0.98,
           hx: (i, n2) => W / 2 + (i - (n2 - 1) / 2) * sw * 0.72 };
}
// Раскладка снимка: id → { x, y, s } (для пузыря s — радиус, для игрушки — размер).
function layoutFrame(F){
  const m = new Map(), r = GEO.r, ts = r * TOY_K;   // ts — размер игрушек в полёте
  F.cols.forEach((col, c) => col.forEach((b, i) => {
    const p = bubbleXY(c, i); m.set(b.id, { x: p.x, y: p.y, s: r, hard: b.hard, bubble: true });
    const ofs = SLOT_OFS[Math.min(3, b.toys.length)];
    const bs = r * TOY_BY_N[Math.min(3, b.toys.length)];
    b.toys.forEach((t, k) => m.set(t.id, { x: p.x + ofs[k][0] * r, y: p.y + ofs[k][1] * r, s: bs, k: t.k }));
  }));
  const cs = cupSlots(F.cup.length, F.cap);
  if (F.air && F.air.cup){                                    // кучка висит над мыльницей
    F.air.toys.forEach((t, k) => m.set(t.id, { x: cs.hx(k, F.air.toys.length), y: cs.hoverY, s: cs.s, k: t.k, z: V3.CUP_Z + 0.75, air: true }));
  } else if (F.air){
    const p = bubbleXY(F.air.c, F.air.at), n = F.air.toys.length, per = 3;
    F.air.toys.forEach((t, k) => {
      const row = Math.floor(k / per), inRow = Math.min(per, n - row * per), col = k % per;
      m.set(t.id, { x: p.x + (col - (inRow - 1) / 2) * ts * 2.25, y: p.y + row * ts * 1.9 - (Math.ceil(n / per) - 1) * ts * 0.95, s: ts, k: t.k });
    });
  }
  // Стаканчик полон, а прилетела ещё одна (собирает тройку или переполняет): новенькая не сдвигает соседей, а встаёт
  // над своей парой (или над серединой), остальные стоят в своих гнёздах.
  const ev = F.ev || [];                                     // у итогового кадра (после анимации) событий может не быть
  const extra = F.cup.length > F.cap ? (ev.find(e => (e.t === 'cup' || e.t === 'overflow') && e.id) || {}).id : undefined;
  let slot = 0, spill = 0;
  const spillN = Math.max(0, F.cup.length - (extra !== undefined ? 1 : 0) - F.cap);
  F.cup.forEach((t) => {
    if (t.id === extra) return;
    if (slot < F.cap) m.set(t.id, { x: cs.x(slot), y: cs.y, s: cs.s, k: t.k, z: V3.CUP_Z + 0.75, cup: true });
    else m.set(t.id, { x: cs.hx(spill++, spillN), y: cs.hoverY, s: cs.s, k: t.k, z: V3.CUP_Z + 0.75, over: true });   // сверх мест (страховка)
    slot++;
  });
  if (extra !== undefined){
    const t = F.cup.find(x => x.id === extra), mates = F.cup.filter(x => x.k === t.k && x.id !== extra).map(x => m.get(x.id)).filter(Boolean);
    const gx = mates.length ? mates.reduce((a, q) => a + q.x, 0) / mates.length : W / 2;
    m.set(extra, { x: gx, y: cs.y - cs.sw * 0.62, s: cs.s, k: t.k, z: V3.CUP_Z + 0.95, over: ev.some(e => e.t === 'overflow') });
  }
  return m;
}

// --- ввод: Pointer Events, порог тап/драг 10 px, pointercancel = pointerup (§3) ---
let down = null;
function toVirtual(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function bubbleAt(p){
  if (!G.s || !GEO) return null;
  let best = null, bd = Infinity;
  G.s.cols.forEach((col, c) => col.forEach((b, i) => {
    const q = bubbleXY(c, i), d = Math.hypot(p.x - q.x, p.y - q.y);
    if (d < GEO.r * 1.08 && d < bd){ bd = d; best = { c, i }; }
  }));
  return best;
}
cv.addEventListener('pointerdown', (e) => { Snd.init(); down = toVirtual(e); down.id = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const hit = bubbleAt(down); if (hit && G.s && !G.ending){ G.press = { id: G.s.cols[hit.c][hit.i].id, t: now() }; Snd.press(); } });
function onUp(e){
  if (!down || e.pointerId !== down.id) return;
  const p = toVirtual(e), moved = Math.hypot(p.x - down.x, p.y - down.y) > 10 / scale;
  const start = down; down = null; G.press = null;
  if (moved || e.type === 'pointercancel') return;
  const hit = bubbleAt(start); if (hit) tapBubble(hit.c, hit.i);
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {          // дубли на клавиатуру для отладки (§3): цифра — верхний тапабельный пузырь столбика
  if (e.key >= '1' && e.key <= '9' && G.s){
    const c = +e.key - 1, col = G.s.cols[c]; if (!col) return;
    if (col.length) tapBubble(c, col.length - 1);
  }
  if (e.key === 'z' || e.key === 'u') undo();
  if (e.key === 'r' && G.s) startLevel(G.s.li);
  if (e.key === 'm') goto('menu');
  if (e.key === 'h' && G.s){ G.hintMove = (solve(G.s) || [])[0] ?? -1; }
});
$('btn-undo').onclick = () => { log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { log('input', 'button', 'reset'); startLevel(G.s ? G.s.li : 0); };
$('btn-menu').onclick = () => { log('input', 'button', 'menu'); goto('menu'); };
$('btn-mute').onclick = () => { Snd.init(); G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
let PAL = null;
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  scale = r.width / VW; W = VW; H = r.height / scale;
  const cw = Math.round(r.width * DPR), ch = Math.round(r.height * DPR);
  if (cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
  GEO = computeGeo(); PAL = readPalette();
  if (R3.ok){ R3.renderer.setPixelRatio(DPR); R3.renderer.setSize(r.width, r.height, false); }
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// --- рендер: всё в canvas, цвета из CSS-переменных (§9) ---
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function readPalette(){
  const p = {};
  for (const k of ['wall', 'grout', 'tub', 'tub-shade', 'water', 'water-hi', 'foam', 'bubble', 'bubble-hard', 'rim', 'rim-hard', 'cup', 'cup-rim', 'slot',
    'outline', 'beak', 'belly', 'white', 'danger', 'accent', 'ink']) p[k] = css('--' + k);
  p.toys = [0, 1, 2, 3, 4, 5].map(i => css('--toy' + i));
  return p;
}
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - (1 - p) * (1 - p);
const easeIn = (p) => p * p;

function render(){
  const t = now();
  if (!PAL || !GEO) fit();
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
  if (R3.ok) ctx.clearRect(0, 0, W, H); else drawBathroom(ctx);
  // какой кадр хода показываем
  let A = null, B = null, p = 1;
  if (G.s && G.anim){
    const a = G.anim;
    while (a.k + 1 < a.frames.length && t >= a.starts[a.k + 1]){ a.k++; fireEvents(a.frames[a.k], a.frames[a.k - 1]); }
    if (t >= a.end){ G.anim = null; log('fx.end', 'move'); }
    else { A = a.frames[a.k - 1]; B = a.frames[a.k]; p = Math.min(1, (t - a.starts[a.k]) / (B.dur / G.timeScale)); }
  }
  if (G.s && !B){ A = B = { cols: G.s.cols, cup: G.s.cup, cap: G.s.cap, air: null, ev: G.s.lost && G.s.overId ? [{ t: 'overflow', id: G.s.overId }] : [] }; }
  const view = B ? buildView(A, B, p, t) : null;
  if (R3.ok) draw3D(view, t); else if (view) draw2D(view, t);
  if (view) for (const b of view.bubbles) if (b.hard) drawHardBadge(ctx, b.x + b.r * 0.66, b.y - b.r * 0.66, b.r);
  G.fx = G.fx.filter(f => f.until > t);
  for (const f of G.fx) if (!R3.ok || f.type === 'text') drawFx(ctx, f, t);
  if (!G.s) return;
  // подсказка-палец на обучающих уровнях
  if (G.hintMove >= 0 && !G.anim){
    const c = G.hintMove >> 4, i = G.hintMove & 15;
    if (G.s.cols[c] && G.s.cols[c][i]){ const q = bubbleXY(c, i); drawFinger(ctx, q.x + GEO.r * 0.78, q.y + GEO.r * 0.72, t); }
  }
  if (G.ending && t >= G.ending && !G.anim) finishEnding();
  if (toastUntil && t > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}
// Срез кадра для отрисовки: позиции пузырей и игрушек между двумя снимками хода, «желе» и сплющивание по времени.
function buildView(A, B, p, t){
  const LA = A === B ? null : layoutFrame(A), LB = layoutFrame(B);
  const pos = (id, ease) => { const b = LB.get(id), a = LA && LA.get(id) || b, e = ease(p); return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), s: lerp(a.s, b.s, e), z: lerp(a.z || 0, b.z || 0, e) }; };
  const jelly = (t0) => { if (t0 === undefined || t < t0) return 0; const q = (t - t0) / CFG.JELLY_MS; return q >= 1 ? 0 : Math.sin(q * Math.PI * 3) * (1 - q); };
  const bubbles = [];
  B.cols.forEach(col => col.forEach(b => {
    const q = pos(b.id, easeOut), w = jelly(G.wob[b.id]);
    if (G.wob[b.id] !== undefined && t > G.wob[b.id] + CFG.JELLY_MS) delete G.wob[b.id];
    const press = G.press && G.press.id === b.id ? Math.min(1, (t - G.press.t) / 90) : 0;
    bubbles.push({ id: b.id, hard: b.hard, x: q.x, y: q.y, r: q.s * (1 - 0.08 * press), jelly: w });
  }));
  const air = new Set(B.air ? B.air.toys.map(x => x.id) : []);
  const toys = [];
  const addToy = (toy) => { const q = pos(toy.id, easeIn); const lb = LB.get(toy.id); toys.push({ id: toy.id, k: toy.k, x: q.x, y: q.y, s: q.s, z: q.z, cup: !!lb.cup && p >= 1 || (!!lb.cup && LA && LA.get(toy.id) && LA.get(toy.id).cup), over: !!lb.over, air: air.has(toy.id) || (LA && LA.get(toy.id) && LA.get(toy.id).x !== lb.x), squash: jelly(G.squash[toy.id]) }); };
  B.cols.forEach(col => col.forEach(b => b.toys.forEach(addToy)));
  if (B.air) B.air.toys.forEach(addToy);
  B.cup.forEach(addToy);
  let shake = 0; for (const f of G.fx) if (f.type === 'shake' && t < f.until) shake = Math.max(shake, f.amp * (1 - (t - f.t0) / (f.until - f.t0)));
  return { bubbles, toys, cup: { n: B.cup.length, cap: B.cap }, shake };
}
// 2D-запасной рендер (нет WebGL): те же данные, плоские фигуры.
function draw2D(v, t){
  const sh = Math.sin(t * 0.06) * v.shake;
  drawCup(ctx, W / 2 + sh, GEO.cupY, cupSlots(v.cup.n, v.cup.cap), v.cup.cap, v.cup.n >= v.cup.cap, v.cup.n > v.cup.cap);
  for (const q of v.bubbles) drawBubbleBack(ctx, q.x, q.y, q.r * (1 + 0.06 * q.jelly), q.hard);
  for (const q of v.toys) drawToy(ctx, q.k, q.x, q.y, q.s * (1 + 0.15 * q.squash));
  for (const q of v.bubbles) drawBubbleFront(ctx, q.x, q.y, q.r * (1 + 0.06 * q.jelly), q.hard);
}

// ---------------------------------------------------------------------------
// 3D-слой (three.js 0.185.1). Камера смотрит в лоб: плоскость z = 0 проецируется ровно в виртуальную 2D-раскладку,
// поэтому ядро, попадание тапа и подписи остаются в виртуальных координатах, а W3() переводит точку на любой глубине
// так, чтобы на экране она осталась на месте. Игрушки — GLB из Tripo (assets/models/<вид>.glb, конвейер GPT → Tripo),
// пузыри — шейдер с радужной плёнкой, стена, ванна, вода, пена и мыльница-стаканчик — геометрия кодом.
// ---------------------------------------------------------------------------
async function loadGLB(url){
  const res = await fetch(url); if (!res.ok) throw new Error('нет файла ' + url);
  const buf = await res.arrayBuffer(), dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('не GLB: ' + url);

function spawnPop(x, y, r, chain){

    const dir = [Math.cos(a) * Math.cos(el), Math.sin(a) * Math.cos(el), Math.sin(el)];

function updatePool(pool, t, kind){
  const T = R3.T, M = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), v = new T.Vector3(), sc = new T.Vector3();
  for (let i = 0; i < pool.n; i++){
    const o = pool.list[i];
    if (!o){ continue; }
    const dt = (t - o.t0) / 1000;
    if (dt < 0){ M.makeScale(0, 0, 0); pool.m.setMatrixAt(i, M); continue; }
    const q01 = (t - o.t0) / o.life;
    if (q01 >= 1){ pool.list[i] = null; M.makeScale(0, 0, 0); pool.m.setMatrixAt(i, M); continue; }
    const dr = o.drag ? (1 - Math.exp(-o.drag * dt)) / o.drag : dt;
    v.set(o.p[0] + o.v[0] * dr, o.p[1] + o.v[1] * dr + 0.5 * o.g * dt * dt * (o.drag ? 0.35 : 1), o.p[2] + o.v[2] * dr);
    const s = lerp(o.s0, o.s1, q01); sc.set(s, s, s);
    e.set((o.spin || 0) * dt, (o.spin || 0) * dt * 0.7, 0); q.setFromEuler(e);
    M.compose(v, q, sc); pool.m.setMatrixAt(i, M);
  }

}

// GLB игрушек: нормализуем — центр в нуле, наибольший размер = 1, лицом к камере (+z).
async function loadToys(){
  const T = R3.T; let n = 0;
  await Promise.all(TOY_FILES.map(async (name, k) => {
    try {
      const root = await loadGLB('assets/models/' + name + '.glb');
      const box = new T.Box3().setFromObject(root), size = box.getSize(new T.Vector3()), c = box.getCenter(new T.Vector3());
      const piv = new T.Group(); root.position.sub(c); piv.add(root);
      piv.scale.setScalar(1 / Math.max(size.x, size.y, size.z));
      const wrap = new T.Group(); wrap.add(piv);
      wrap.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = false; if (o.material){ o.material.metalnessMap = null; o.material.metalness = 0; o.material.envMapIntensity = 0.5; o.material.roughness = 0.5; o.material.needsUpdate = true; } } });

// Прогрев: один раз нарисовать всё, что появится позже (игрушки всех видов, частицы, кольца) — иначе рывок в кадре первого появления.
function warm3D(){
  const T = R3.T, tmp = [];
  R3.models.forEach((m, k) => { const c = m.clone(); c.position.set(k * 0.3 - 1, 2, 0); c.scale.setScalar(0.3); R3.scene.add(c); tmp.push(c); });
  const fb = new T.Mesh(R3.bubGeo, R3.matHard); fb.position.set(1, 2, 0); fb.scale.setScalar(0.2); R3.scene.add(fb); tmp.push(fb);
  for (const r of R3.rings){ r.mesh.visible = true; r.mesh.scale.setScalar(0.001); }
  try { R3.renderer.compile(R3.scene, R3.camera); R3.renderer.render(R3.scene, R3.camera); } catch (e) {}
  for (const o of tmp) R3.scene.remove(o);
  for (const r of R3.rings) r.mesh.visible = false;
}
function draw3D(v, t){

  if (R3.foamList){
    const M = new T.Matrix4(), q = new T.Quaternion(), p = new T.Vector3(), s = new T.Vector3();
    R3.foamList.forEach((f, i) => { const [x] = W3(f.x, GEO.waterY, f.z); const b = 1 + Math.sin(t * 0.002 + i * 1.7) * 0.08; p.set(x, -0.05 + f.s * 0.3, f.z); s.set(f.s * b, f.s * 0.8 * b, f.s * b); M.compose(p, q, s); R3.foam.setMatrixAt(i, M); });

  }

    const ck = (G.s ? G.s.li : -1) + ':' + v.cup.cap + ':' + W + ':' + Math.round(H);
    if (R3.cupKey !== ck){ R3.cupKey = ck; layoutCup(v.cup.cap); }
    const danger = v.cup.n >= v.cup.cap, over = v.cup.n > v.cup.cap;
    const last = v.cup.n >= v.cup.cap - 1 && v.cup.n > 0;      // осталось одно место или полон — ободки коралловые
    R3.cupMat.emissiveIntensity = over ? 0.7 : danger ? 0.18 + 0.14 * Math.sin(t * 0.012) : 0;
    R3.sockets.forEach((rg, i) => { rg.material = last && i >= v.cup.n ? R3.sockWarn : R3.sockRim; });   // коралловым — только свободное место

// Стена в плитку и ванна с водой и пеной (фон; от W, H, GEO.waterY).
function drawBathroom(c){

  const w = cs.w, h = GEO.cupH;
  c.fillStyle = over ? PAL.danger : PAL.cup; c.strokeStyle = danger ? PAL.danger : PAL['cup-rim']; c.lineWidth = 4;
  c.beginPath(); c.moveTo(cx - w / 2, cy - h / 2); c.lineTo(cx + w / 2, cy - h / 2); c.lineTo(cx + w / 2 - 10, cy + h / 2); c.lineTo(cx - w / 2 + 10, cy + h / 2); c.closePath();
  c.fill(); c.stroke();
  c.fillStyle = PAL.slot;
  for (let i = 0; i < cap; i++){ c.beginPath(); c.arc(cs.x(i) + (cx - W / 2), cs.y, cs.s * 1.25, 0, Math.PI * 2); c.fill(); }
}
// Игрушки — плоские фигуры с обводкой; каждый вид отличается и формой, не только цветом (§9).
function drawToy(c, k, x, y, s){
  c.save(); c.translate(x, y); c.lineWidth = Math.max(1.4, s * 0.13); c.strokeStyle = PAL.outline; c.lineJoin = 'round';
  const col = PAL.toys[k];
  if (k === 0) drawDuck(c, s, col); else if (k === 1) drawWhale(c, s, col); else if (k === 2) drawFish(c, s, col);
  else if (k === 3) drawFrog(c, s, col); else if (k === 4) drawBoat(c, s, col); else drawStar(c, s, col);
  c.restore();
}
function eye(c, x, y, r){ c.fillStyle = PAL.outline; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function drawDuck(c, s, col){            // утёнок: тело, голова, клюв, крыло
  c.fillStyle = col;
  c.beginPath(); c.ellipse(-0.12 * s, 0.28 * s, 0.85 * s, 0.55 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.arc(0.32 * s, -0.36 * s, 0.44 * s, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = PAL.beak; c.beginPath(); c.moveTo(0.68 * s, -0.42 * s); c.lineTo(1.05 * s, -0.28 * s); c.lineTo(0.68 * s, -0.14 * s); c.closePath(); c.fill(); c.stroke();
  eye(c, 0.42 * s, -0.46 * s, 0.09 * s);
  c.beginPath(); c.ellipse(-0.25 * s, 0.22 * s, 0.38 * s, 0.2 * s, -0.25, 0, Math.PI); c.stroke();
}
function drawWhale(c, s, col){           // кит: хвост, тело, светлое брюхо, фонтанчик
  c.fillStyle = col;
  c.beginPath(); c.moveTo(-0.6 * s, 0.15 * s); c.lineTo(-1.02 * s, -0.32 * s); c.lineTo(-0.9 * s, 0.1 * s); c.lineTo(-1.02 * s, 0.45 * s); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(0.1 * s, 0.15 * s, 0.82 * s, 0.56 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = PAL.belly; c.beginPath(); c.ellipse(0.18 * s, 0.44 * s, 0.52 * s, 0.17 * s, 0, 0, Math.PI * 2); c.fill();
  eye(c, 0.52 * s, 0.02 * s, 0.09 * s);
  c.strokeStyle = col; c.lineWidth = 0.14 * s; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0.1 * s, -0.45 * s); c.quadraticCurveTo(0, -0.85 * s, -0.25 * s, -0.8 * s);
  c.moveTo(0.1 * s, -0.45 * s); c.quadraticCurveTo(0.2 * s, -0.85 * s, 0.45 * s, -0.8 * s); c.stroke(); c.lineCap = 'butt';
}
function drawFish(c, s, col){            // рыбка: тело, хвост-треугольник, плавник, глаз
  c.fillStyle = col;
  c.beginPath(); c.moveTo(0.5 * s, 0); c.lineTo(1.02 * s, -0.48 * s); c.lineTo(1.02 * s, 0.48 * s); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(-0.12 * s, 0, 0.75 * s, 0.52 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(0.05 * s, -0.3 * s); c.quadraticCurveTo(0.3 * s, 0, 0.05 * s, 0.3 * s); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.arc(-0.48 * s, -0.12 * s, 0.17 * s, 0, Math.PI * 2); c.fill(); eye(c, -0.5 * s, -0.12 * s, 0.08 * s);
}
function drawFrog(c, s, col){            // лягушка: круглое тело, два глаза-бугорка, улыбка
  c.fillStyle = col;
  c.beginPath(); c.arc(-0.38 * s, -0.48 * s, 0.3 * s, 0, Math.PI * 2); c.arc(0.38 * s, -0.48 * s, 0.3 * s, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(0, 0.15 * s, 0.85 * s, 0.68 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.arc(-0.38 * s, -0.5 * s, 0.17 * s, 0, Math.PI * 2); c.arc(0.38 * s, -0.5 * s, 0.17 * s, 0, Math.PI * 2); c.fill();
  eye(c, -0.36 * s, -0.5 * s, 0.08 * s); eye(c, 0.4 * s, -0.5 * s, 0.08 * s);
  c.beginPath(); c.arc(0, 0.12 * s, 0.4 * s, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
}
function drawBoat(c, s, col){            // кораблик: корпус-трапеция, мачта, белый парус
  c.fillStyle = col;
  c.beginPath(); c.moveTo(-0.95 * s, 0.2 * s); c.lineTo(0.95 * s, 0.2 * s); c.lineTo(0.6 * s, 0.7 * s); c.lineTo(-0.6 * s, 0.7 * s); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-0.05 * s, 0.2 * s); c.lineTo(-0.05 * s, -0.9 * s); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.moveTo(0.02 * s, -0.85 * s); c.lineTo(0.02 * s, 0.08 * s); c.lineTo(0.72 * s, 0.08 * s); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = col; c.beginPath(); c.moveTo(-0.12 * s, -0.85 * s); c.lineTo(-0.12 * s, -0.25 * s); c.lineTo(-0.62 * s, -0.25 * s); c.closePath(); c.fill(); c.stroke();
}
function drawStar(c, s, col){            // звезда: пять лучей и рожица
  c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 0.45 * s : 0.98 * s; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr + 0.06 * s); }
  c.closePath(); c.fill(); c.stroke();
  eye(c, -0.18 * s, 0, 0.08 * s); eye(c, 0.18 * s, 0, 0.08 * s);
  c.beginPath(); c.arc(0, 0.12 * s, 0.17 * s, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
}
// Значок двойного пузыря: два наложенных кружка и «2» — читается формой, не цветом (§9).
function drawHardBadge(c, x, y, r){
  const s = Math.max(9, r * 0.24);
  c.save(); c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.fillStyle = '#2f7ef0';
  c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.font = '900 ' + Math.round(s * 1.25) + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('2', x, y + 1); c.restore();
}
// Палец-подсказка: кольцо пульсирует над пузырём, кончик указывает на него.
function drawFinger(c, x, y, t){
  const k = 0.5 + 0.5 * Math.sin(t * 0.008), r = GEO.r;
  c.strokeStyle = PAL.accent; c.lineWidth = 3; c.globalAlpha = 0.9 - 0.5 * k;
  c.beginPath(); c.arc(x - r * 0.45, y - r * 0.35, r * (0.5 + 0.5 * k), 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1;
  c.save(); c.translate(x + k * 4, y + k * 4); c.rotate(-0.5);
  c.fillStyle = PAL.white; c.strokeStyle = PAL.outline; c.lineWidth = 2.5;
  c.beginPath(); c.roundRect(-7, -12, 14, 34, 7); c.fill(); c.stroke();
  c.beginPath(); c.roundRect(-13, 8, 28, 26, 9); c.fill(); c.stroke();
  c.restore();
}
// Эффекты в canvas (§9): брызги лопнувшего пузыря, улёт тройки, вспышка в стаканчике, всплывающий текст.
function drawFx(c, f, t){
  const p = Math.min(1, (t - f.t0) / (f.until - f.t0));
  if (f.type === 'pop'){
    c.strokeStyle = PAL.white; c.lineWidth = 3 * (1 - p); c.globalAlpha = 1 - p;
    c.beginPath(); c.arc(f.x, f.y, f.r * (1 + 0.45 * p), 0, Math.PI * 2); c.stroke();
    c.fillStyle = PAL.white;
    for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4 + f.chain, d = f.r * (1 + 0.8 * easeOut(p)); c.beginPath(); c.arc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 4 * (1 - p) + 1, 0, Math.PI * 2); c.fill(); }
    c.globalAlpha = 1;
  } else if (f.type === 'fly'){
    const y = f.y - 150 * easeIn(p), a = 1 - p;
    c.globalAlpha = a;
    drawBubbleBack(c, f.x, y, f.r, false);
    const ofs = SLOT_OFS[3];
    for (const o of ofs) drawToy(c, f.k, f.x + o[0] * f.r, y + o[1] * f.r, f.r * TOY_K);
    drawBubbleFront(c, f.x, y, f.r, false);
    c.fillStyle = PAL.accent;
    for (let i = 0; i < 6; i++){ const ang = i * 1.05 + p * 3, d = f.r * (1.1 + 0.6 * p); c.beginPath(); c.arc(f.x + Math.cos(ang) * d, y + Math.sin(ang) * d, 3, 0, Math.PI * 2); c.fill(); }
    c.globalAlpha = 1;
  } else if (f.type === 'clear'){
    c.globalAlpha = 1 - p; drawToy(c, f.k, f.x, f.y - 40 * p, f.s * (1 + 0.6 * p)); c.globalAlpha = 1;
  } else if (f.type === 'text'){
    const pop = p < 0.18 ? 0.6 + 0.6 * (p / 0.18) : p < 0.3 ? 1.2 - 0.2 * ((p - 0.18) / 0.12) : 1;
    c.save(); c.globalAlpha = p < 0.75 ? 1 : 1 - (p - 0.75) / 0.25; c.translate(f.x, f.y - 34 * easeOut(p)); c.scale(pop, pop);
    c.font = (f.big ? '900 30' : '800 22') + 'px system-ui, -apple-system, sans-serif'; c.textAlign = 'center'; c.lineJoin = 'round';
    c.lineWidth = f.big ? 7 : 5; c.strokeStyle = f.big ? '#7a2fb8' : '#315b70'; c.strokeText(f.text, 0, 0);
    c.fillStyle = f.big ? '#ffe14d' : '#ffffff'; c.fillText(f.text, 0, 0); c.restore();
  }
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4) ---
let lastFrame = 0;
// Ошибка отрисовки не должна останавливать цикл (раньше rAF не перезаказывался — игра «застывала» кадром).
let renderErr = '';
function safeRender(){
  try { render(); }
  catch (e){ const m = String(e && e.stack || e).slice(0, 300); if (m !== renderErr){ renderErr = m; console.error(e); log('event', 'error', m); }
    if (G.ending && now() >= G.ending && !G.anim) try { finishEnding(); } catch (e2) {} }   // экран итога всё равно открыть
}
function frame(){ requestAnimationFrame(frame); lastFrame = performance.now(); if (!G.paused) safeRender(); }
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, прогон времени, автоигра ---
window.PENA_V_VANNE = {
  G, CFG, LEVELS,
  state(){
    if (!G.s) return { screen: G.screen };
    const cols = G.s.cols.map(col => col.map(b => (b.hard ? '#' : '') + b.toys.map(t => 'ABCDEF'[t.k]).join('')).join(' ')).join(' | ');
    return { level: G.s.li + 1, cols, cup: G.s.cup.map(t => 'ABCDEF'[t.k]).join(''), cap: G.s.cap, moves: G.s.moves, par: G.s.par,
             win: isWin(G.s), lose: isLose(G.s), why: G.s.why, animating: !!G.anim, screen: G.screen };
  },
  play(n){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1)); return this.state(); },
  custom(rows, cap){                            // своя раскладка для проверки: custom([['B'], ['A'], ['AB']], 3) — столбики снизу вверх
    startLevel(0); G.s = layoutToState(0, parseLayout(rows), cap || CFG.CUP_CAP, 0); G.maxH = Math.max(...G.s.cols.map(c => c.length));
    G.hintMove = -1; $('tip').textContent = ''; fit(); hud(); R3.foamKey = R3.cupKey = ''; return this.state(); },
  tap(c, i){ tapBubble(c, i); return this.state(); },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(){ return G.s ? (solve(G.s) || []).map(m => [m >> 4, m & 15]) : null; },
  auto(delayMs){ const path = this.solve() || []; path.forEach(([c, i], k) => setTimeout(() => tapBubble(c, i), (delayMs || 700) * (k + 1))); return path; },
  drive(sec){                                   // ручной прогон игрового времени: часы сдвигаются шагами по 16 мс
    const steps = Math.ceil(sec * 1000 / 16);
    for (let k = 0; k < steps; k++){ G.skew += 16; safeRender(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
fit(); init3D(); fit(); hud();
const startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
if (startHash === 'game') startLevel(G.save.level); else goto(startHash || 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length);
</script>
</body>
