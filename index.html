<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Пена в ванне». Столбики (снизу вверх) из элементов: пузырь (до CFG.CAP игрушек), широкий пузырь, губка.
// Тап по пузырю — он лопается, его игрушки падают потоком вниз в ближний элемент ниже в том же столбике.
//   влезли  → остаются; три одинаковых в пузыре — пузырь улетает вместе с ними;
//   не влезли → нижний лопается от тяжести, всё падает дальше (цепочка), тройка в падающей куче улетает на лету;
//   ниже пузырей нет → игрушки в общую мыльницу (стаканчик); там тройка тоже улетает; больше cap — проигрыш.
// Механики (v1.0, DESIGN «План v0.5 → v1.0»):
//   замок (lock)    — тапом не лопается, пока над ним есть пузыри; тяжесть лопает всегда; стал верхним — открылся навсегда;
//   краник (valves) — на стене у столбика c на высоте k (между рядами k−1 и k), носик в соседний to; открыт/закрыт,
//                     тап переключает (это ход). Поток, пересекающий высоту k в столбике c при открытом кране, уходит в to
//                     и падает там с высоты k (в элемент с наибольшим индексом ≤ k−1, нет — в мыльницу). Каждый кран —
//                     не больше раза за поток. Ряды — текущие индексы (пузыри оседают, кран на стене стоит);
//   мутный (murky)  — содержимое не видно игроку (солверу видно); проясняется, когда в него упало или он стал верхним;
//   широкий (wc)    — только нижний ряд, под столбиками wc и wc+1 (общий индекс 0), CFG.WIDE_CAP мест; тройка в нём
//                     улетает сразу, сам пузырь остаётся; больше мест — лопается, всё в мыльницу; тап — то же;
//   крепкий (strong)— от перегруза не лопается: добирает до CAP, излишек ложится сверху новыми пузырями по 3
//                     (тройки в них улетают), цепочка на нём останавливается; тап лопает как обычно;
//   губка (sp)      — не пузырь, держит одну игрушку: пустая впитывает из потока одну (вид, которого в потоке меньше
//                     всего), остальное падает мимо; тап «выжимает» — игрушка падает вниз потоком из одной.
// Победа — игрушек не осталось нигде (и в губках). Проигрыш — только переполнение мыльницы (revive() — «пузырь спасения»).
// Ход — число: столбик * 16 + номер элемента снизу; краник — VALVE_M + номер краника.
// ---------------------------------------------------------------------------
const CFG = {
  CAP: 3,                 // мест в пузыре
  WIDE_CAP: 5,            // мест в широком пузыре
  MATCH: 3,               // столько одинаковых игрушек улетают (в пузыре и в стаканчике)
  CUP_CAP: 4,             // мест в стаканчике по умолчанию (уровень переопределяет полем cup)
  AIR_MATCH: true,        // в цепочке тройка одинаковых улетает прямо на лету, остаток падает дальше и может влезть
  REVIVE_TAKE: 2,         // «пузырь спасения»: сколько игрушек забрать из мыльницы вместе с лишней
  GEN_TRIES: 400,         // попыток генератора при поиске уровня (сид от номера уровня, поток детерминирован; поиск — оффлайн, bake)
  BOT_RUNS: 80,           // прогонов бота-новичка при отборе уровня
  BOT_MAX_MOVES: 120,     // предел ходов бота (страховка) — дальше партия считается проигранной
  BOT_VALVE_RUN: 2,       // боты щёлкают краники не больше стольких раз подряд, потом обязаны лопать (как живой игрок)
  MURKY_NEED: 0.05,       // мутный нужен, если новичок вслепую выигрывает хотя бы на столько реже, чем зрячий
  SOLVER_MAX: 150000,     // предел состояний поиска в ширину (защита от зависания)
  NEED_PENALTY: 0.3,      // штраф отбора: механика уровня декоративна (без неё решается так же)
  // Кадры анимации хода, мс (делятся на timeScale)
  T_POP: 110,             // пузырь лопнул, игрушки повисли
  T_FALL: 240,            // игрушки долетели до пузыря ниже
  T_VALVE: 220,           // поток ушёл в краник и перелетел в соседний столбик
  T_SPONGE: 200,          // губка впитала игрушку
  T_FLY: 380,             // тройка в пузыре улетает
  T_CUP: 300,             // кучка долетела до места над стаканчиком
  T_CUP_STEP: 170,        // одна игрушка опускается в гнездо (по очереди)
  T_CLEAR: 320,           // тройка в стаканчике улетает
  T_OVER: 420,            // стаканчик переполнился
  T_REVIVE: 520,          // «пузырь спасения»: игрушки поднимаются из мыльницы в новый пузырь
  END_DELAY: 550,         // пауза между последним кадром и экраном победы/поражения
  TOAST_MS: 2400,         // сколько висит тост
  JELLY_MS: 480,          // «желе» пузыря и сплющивание игрушки после приземления, мс
  STAR2_SLACK: 2,         // звёзды: тапов ≤ par → 3, ≤ par + STAR2_SLACK → 2, иначе 1
  UNDO_START: 3,          // бустер «Отмена»: сколько на старте (дальше — «+1 за рекламу», заглушка)
};
const VALVE_M = 256;      // ходы ≥ VALVE_M — тап по кранику
const KIND_NAMES = ['утёнок', 'кит', 'рыбка', 'лягушка', 'кораблик', 'звезда'];
const MECHS = ['lock', 'valve', 'murky', 'wide', 'strong', 'sponge'];

// Контент — декларативная таблица. layout — ручной уровень (столбики снизу вверх; буква = игрушка A..F, префиксы:
// '#' замок, '?' мутный, '!' крепкий, '*' губка, '=' широкий — в двух соседних столбиках ряда 0: '=AB' и '='),
// valves — [[столбик, высота, куда, открыт]]. Иначе — генератор по параметрам:
//   cols — столбиков, maxH — потолок высоты столбика, kinds — видов игрушек, per — игрушек каждого вида (кратно 3),
//   pure — сколько троек лежат «чистыми» кусками в одном столбике, empty — пустых пузырей, spread — доля чистых кусков,
//   разбросанных по столбику поодиночке; механики: lock, murky, strong, sponge, valves — сколько штук, wide — 0/1;
//   cup — мест в стаканчике, minPar — минимум тапов в лучшем решении,
//   nov / novMax — коридор побед бота-новичка (он не видит мутное), rnd — потолок побед случайного бота,
//   minTri — сколько троек в пузыре новичок должен собирать в среднем, chain — лучшее решение обязано содержать цепочку;
//   need — какие механики обязаны быть нужными (по умолчанию — все, что есть на уровне);
//   pick, seed — запечённый номер раскладки в потоке генератора и номер потока (пишет `node sim.mjs bake`).
// Коридоры новичка (DIFF): I — главы 11–19 (75–85%), E / M / H — пила с 20-го (лёгкий ~85%, средний ~65%, сложный ~45%).
const DIFF = { I: { nov: 0.75, novMax: 0.85, rnd: 0.3 }, E: { nov: 0.8, novMax: 0.92, rnd: 0.35 },
               M: { nov: 0.55, novMax: 0.75, rnd: 0.25 }, H: { nov: 0.35, novMax: 0.55, rnd: 0.2 } };
const LEVELS = [
  { n: 1, layout: [['AA', 'A'], ['BB', 'B']], cup: 4, hint: true,
    tip: 'Лопни верхний пузырь' },
  { n: 2, layout: [['A', 'BB', 'AA'], ['B']], cup: 4, hint: true,
    tip: 'Перегруз лопает пузырь ниже' },
  { n: 3, pick: 7, cols: 3, maxH: 3, kinds: 2, per: 3, pure: 1, empty: 1, cup: 4, minPar: 3, nov: 0.9, rnd: 1.0, minTri: 0.5,
    tip: 'Лишнее падает в мыльницу — не переполни' },
  { n: 4, pick: 10, cols: 3, maxH: 3, kinds: 3, per: 3, pure: 2, spread: 0.5, empty: 0, cup: 3, minPar: 4, nov: 0.8, rnd: 0.6, minTri: 1, chain: true },
  { n: 5, pick: 4, cols: 4, maxH: 3, kinds: 4, per: 3, pure: 2, spread: 0.5, empty: 1, cup: 3, minPar: 5, nov: 0.75, rnd: 0.5, minTri: 1, chain: true },
  { n: 6, pick: 14, cols: 3, maxH: 4, kinds: 3, per: 3, pure: 2, spread: 0.5, empty: 0, lock: 1, cup: 3, minPar: 4, nov: 0.75, rnd: 0.5, minTri: 1,
    tip: 'Замок: лопнет, когда над ним пусто' },
  { n: 7, pick: 161, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 3, spread: 0.6, empty: 1, lock: 1, cup: 3, minPar: 5, nov: 0.7, rnd: 0.45, minTri: 1.5, chain: true },
  { n: 8, pick: 4, cols: 4, maxH: 4, kinds: 3, per: 6, pure: 3, spread: 0.6, empty: 0, lock: 1, cup: 3, minPar: 6, nov: 0.65, rnd: 0.4, minTri: 1.5, chain: true },
  { n: 9, pick: 7, cols: 5, maxH: 4, kinds: 5, per: 3, pure: 3, spread: 0.7, empty: 1, lock: 2, cup: 3, minPar: 6, nov: 0.6, rnd: 0.35, minTri: 1.5, chain: true },
  { n: 10, pick: 10, cols: 5, maxH: 4, kinds: 6, per: 3, pure: 4, spread: 0.7, empty: 0, lock: 2, cup: 3, minPar: 7, nov: 0.55, rnd: 0.3, minTri: 2, chain: true },
  // Глава 2: замок, краник, мутный
  { n: 11, pick: 89, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.6, empty: 1, lock: 2, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6 },
  { n: 12, pick: 198, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.7, empty: 0, lock: 2, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6, chain: true },
  { n: 13, pick: 37, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.5, empty: 1, valves: 1, cup: 3, minPar: 5, ...DIFF.I, minTri: 0.6,
    tip: 'Тапни краник: открытый уводит поток вбок' },
  { n: 14, pick: 207, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.6, empty: 1, lock: 1, valves: 1, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6 },
  { n: 15, pick: 95, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.6, empty: 1, valves: 2, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6 },
  { n: 16, pick: 120, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.7, empty: 0, valves: 1, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6, chain: true },
  { n: 17, pick: 25, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.6, empty: 1, murky: 2, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6,
    tip: 'Мутный пузырь прояснится, когда сверху пусто' },
  { n: 18, pick: 14, seed: 2, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.6, empty: 1, murky: 2, valves: 1, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6 },
  { n: 19, pick: 278, seed: 3, cols: 4, maxH: 4, kinds: 4, per: 3, pure: 2, spread: 0.6, empty: 1, murky: 2, lock: 1, cup: 3, minPar: 6, ...DIFF.I, minTri: 0.6 },

  n.cols.forEach(col => col.forEach((b, i) => {
    if ((b.lock || b.murky) && !elsAbove(col, i)){
      if (b.lock) ev.push({ t: 'unlock', id: b.id }); if (b.murky) ev.push({ t: 'reveal', id: b.id });
      delete b.lock; delete b.murky;
    }
  }));
  return ev;
}

// Тройки одинаковых из набора игрушек (без изменения набора) — для «тройки на лету» и широкого пузыря.
function takeTriples(toys){
  const by = {}, out = [];
  for (const t of toys) (by[t.k] = by[t.k] || []).push(t);
  for (const k in by) for (let q = 0; q + CFG.MATCH <= by[k].length; q += CFG.MATCH) out.push(...by[k].slice(q, q + CFG.MATCH));
  return out;
}
// Игрушки, сгруппированные по виду (порядок первых появлений) — для крепкого и «пузыря спасения».
function groupKinds(toys){ const order = []; for (const t of toys) if (!order.includes(t.k)) order.push(t.k); return order.flatMap(k => toys.filter(t => t.k === k)); }
// Губка впитывает игрушку того вида, которого в потоке меньше всего (одиночку), при равенстве — первую.
function pickLone(toys){ const cnt = {}; for (const t of toys) cnt[t.k] = (cnt[t.k] || 0) + 1; let best = toys[0]; for (const t of toys) if (cnt[t.k] < cnt[best.k]) best = t; return best; }
const isTriple = (toys) => toys.length === CFG.MATCH && toys.every(t => t.k === toys[0].k);
// Порядок, в котором кучка опускается в стаканчик: сначала игрушки видов, которые соберут тройку (больше своих
// уже в стаканчике — раньше), затем остальные; одинаковые подряд. Детерминированно.
function orderForCup(cup, falling){
  const cnt = {}, tot = {};
  for (const t of cup){ cnt[t.k] = (cnt[t.k] || 0) + 1; tot[t.k] = (tot[t.k] || 0) + 1; }
  for (const t of falling) tot[t.k] = (tot[t.k] || 0) + 1;
  const score = (t) => (tot[t.k] >= CFG.MATCH ? 100 : 0) + (cnt[t.k] || 0) * 10;
  return falling.slice().sort((a, b) => score(b) - score(a) || a.k - b.k);
}
// Игрушка встаёт в стаканчик рядом со своими (после последней такой же), иначе — в конец.
function insertGrouped(cup, toy){
  let at = -1; for (let i = 0; i < cup.length; i++) if (cup[i].k === toy.k) at = i;
  if (at < 0) cup.push(toy); else cup.splice(at + 1, 0, toy);
}
// Тройки в стаканчике улетают; возвращает улетевшие игрушки.
function clearCup(s){
  const gone = [];
  for (;;){
    const cnt = {}; let hit = -1;
    for (const t of s.cup){ cnt[t.k] = (cnt[t.k] || 0) + 1; if (cnt[t.k] >= CFG.MATCH){ hit = t.k; break; } }
    if (hit < 0) return gone;
    let left = CFG.MATCH;
    s.cup = s.cup.filter(t => { if (t.k === hit && left > 0){ left--; gone.push(t); return false; } return true; });
  }
}
// Снимок для анимации: оболочка тянет каждую игрушку и пузырь по id от снимка к снимку.
function snap(s, air, ev, dur){
  return { cols: cloneCols(s.cols), cup: s.cup.slice(), cap: s.cap, valves: s.valves.map(v => v.open),
           air: air ? { c: air.c, at: air.at, cup: !!air.cup, toys: air.toys.slice() } : null, ev, dur };
}
// Кучка зависает над стаканчиком, игрушки опускаются по одной: каждая встаёт рядом со своими, три одинаковых
// сразу улетают. Первыми идут те, что собирают тройку. Нет места и тройки не собрать — переполнение.
function toCup(n, falling, frames){
  let pend = orderForCup(n.cup, falling);
  if (frames) frames.push(snap(n, { cup: true, toys: pend }, [{ t: 'cupHover' }], CFG.T_CUP));
  while (pend.length){
    const toy = pend[0]; pend = pend.slice(1);
    insertGrouped(n.cup, toy); n.cupMax = Math.max(n.cupMax, n.cup.length);
    if (frames) frames.push(snap(n, pend.length ? { cup: true, toys: pend } : null, [{ t: 'cup', id: toy.id }], CFG.T_CUP_STEP));
    const gone = clearCup(n);
    if (gone.length){ n.cupClears += gone.length / CFG.MATCH; if (frames) frames.push(snap(n, pend.length ? { cup: true, toys: pend } : null, [{ t: 'cupClear', toys: gone }], CFG.T_CLEAR)); }
    if (n.cup.length > n.cap){
      n.lost = true; n.why = 'cup'; n.overId = toy.id; n.overPend = pend;   // остаток кучки не пропадает — для «пузыря спасения»
      if (frames) frames.push(snap(n, pend.length ? { cup: true, toys: pend } : null, [{ t: 'overflow', id: toy.id }], CFG.T_OVER));
      return;
    }
  }
}
// Поток падает в столбике col: top — самый верхний ряд, куда он может попасть, bnd — самая верхняя высота краника,
// которую он ещё пересечёт. Возвращает число пузырей, лопнувших от тяжести.
function flow(n, col, top, bnd, falling, frames){
  let chain = 0; const used = [];
  while (falling.length){
    const arr = n.cols[col], j = Math.min(arr.length - 1, top);
    let vq = -1;                                                       // краник: самый верхний открытый на пути
    n.valves.forEach((v, q) => { if (v.open && v.c === col && v.k > j && v.k <= bnd && !used.includes(q) && (vq < 0 || v.k > n.valves[vq].k)) vq = q; });
    if (vq >= 0){
      const v = n.valves[vq]; used.push(vq);
      if (frames){ frames.push(snap(n, { c: col, at: v.k - 0.5, toys: falling }, [{ t: 'valveIn', q: vq }], CFG.T_FALL));
                   frames.push(snap(n, { c: v.to, at: v.k - 0.5, toys: falling }, [{ t: 'valve', q: vq }], CFG.T_VALVE)); }
      col = v.to; top = v.k - 1; bnd = v.k - 1;
      continue;
    }
    if (j < 0){ toCup(n, falling, frames); break; }                    // ниже пузырей нет — в стаканчик
    const tb = arr[j];
    if (tb.sp){                                                        // губка: пустая впитывает одну, остальное мимо
      if (!tb.toys.length){
        const one = pickLone(falling); tb.toys = [one]; falling = falling.filter(t => t !== one);
        if (frames) frames.push(snap(n, falling.length ? { c: col, at: j, toys: falling } : null, [{ t: 'sponge', id: tb.id, toy: one.id }], CFG.T_SPONGE));
      }
      top = j - 1; bnd = j;
      continue;
    }
    const wide = tb.wc !== undefined, cap = wide ? CFG.WIDE_CAP : CFG.CAP;
    if (tb.toys.length + falling.length <= cap){                       // влезли
      tb.toys = tb.toys.concat(falling); falling = [];
      const ev = [{ t: 'land', id: tb.id }]; if (tb.murky){ delete tb.murky; ev.push({ t: 'reveal', id: tb.id }); }
      if (frames) frames.push(snap(n, null, ev, CFG.T_FALL));
      if (wide){                                                       // широкий: тройка улетает, пузырь остаётся
        const gone = takeTriples(tb.toys);
        if (gone.length){ tb.toys = tb.toys.filter(t => !gone.includes(t)); n.triples += gone.length / CFG.MATCH;
          if (frames) frames.push(snap(n, null, [{ t: 'wideClear', id: tb.id, toys: gone }], CFG.T_CLEAR)); }
      } else if (isTriple(tb.toys)){
        removeEl(n, col, j); n.triples++;
        if (frames) frames.push(snap(n, null, [{ t: 'fly', id: tb.id, toys: tb.toys.slice(), k: tb.toys[0].k }], CFG.T_FLY));
      }
      break;
    }
    if (tb.strong){                                                    // крепкий: добирает до CAP, излишек — пузырями сверху
      const order = orderForCup(tb.toys, falling), room = CFG.CAP - tb.toys.length;
      tb.toys = tb.toys.concat(order.slice(0, room)); delete tb.murky;
      const rest = groupKinds(order.slice(room)), fresh = [];
      for (let q = 0; q < rest.length; q += CFG.CAP) fresh.push({ id: n.nid++, toys: rest.slice(q, q + CFG.CAP) });
      arr.splice(j + 1, 0, ...fresh);
      if (frames) frames.push(snap(n, null, [{ t: 'strong', id: tb.id, fresh: fresh.map(b => b.id) }], CFG.T_FALL));
      for (const b of [tb].concat(fresh)) if (isTriple(b.toys)){
        removeEl(n, col, arr.indexOf(b)); n.triples++;
        if (frames) frames.push(snap(n, null, [{ t: 'fly', id: b.id, toys: b.toys.slice(), k: b.toys[0].k }], CFG.T_FLY));
      }
      break;
    }
    removeEl(n, col, j); chain++;                                      // не влезли — лопается от тяжести
    falling = tb.toys.concat(falling);
    if (frames) frames.push(snap(n, { c: wide ? tb.wc + 0.5 : col, at: j, toys: falling }, [{ t: 'pop', id: tb.id, chain }], CFG.T_FALL));
    if (CFG.AIR_MATCH){
      const gone = takeTriples(falling); falling = falling.filter(t => !gone.includes(t));
      if (gone.length){ n.airTriples += gone.length / CFG.MATCH; if (frames) frames.push(snap(n, falling.length ? { c: wide ? tb.wc + 0.5 : col, at: j, toys: falling } : null, [{ t: 'airClear', toys: gone }], CFG.T_CLEAR)); }
    }
    top = j - 1; bnd = j;
  }
  return chain;
}

// Ход. frames (необязательно) — сюда пишутся снимки для анимации. Нелегальный ход → null.
function applyMove(s, m, frames){
  if (s.lost) return null;
  if (m >= VALVE_M){                                                   // краник: открыть / закрыть
    const q = m - VALVE_M; if (!s.valves[q]) return null;
    const n = cloneState(s); n.prev = s; n.moves++; n.lastChain = 0; n.vrun = (s.vrun || 0) + 1;
    n.valves[q].open = !n.valves[q].open;
    if (frames) frames.push(snap(n, null, [{ t: 'valveToggle', q, open: n.valves[q].open }], CFG.T_POP));
    return n;
  }
  const c = m >> 4, i = m & 15;
  if (!canTap(s, c, i)) return null;
  const n = cloneState(s); n.prev = s; n.moves++; n.vrun = 0;
  const b = n.cols[c][i];
  let falling;
  if (b.sp){                                                           // губка: выжать — игрушка падает вниз
    falling = b.toys; b.toys = [];
    if (frames) frames.push(snap(n, { c, at: i, toys: falling }, [{ t: 'squeeze', id: b.id }], CFG.T_POP));
  } else {
    removeEl(n, c, i); falling = b.toys;
    if (frames) frames.push(snap(n, falling.length ? { c: b.wc !== undefined ? b.wc + 0.5 : c, at: i, toys: falling } : null, [{ t: 'pop', id: b.id, chain: 0 }], CFG.T_POP));
  }
  const chain = flow(n, c, i - 1, i, falling, frames);
  n.lastChain = chain; n.chains += chain; n.maxChain = Math.max(n.maxChain, chain);
  if (!n.lost){ const ev = settle(n); if (ev.length && frames) frames.push(snap(n, null, ev, CFG.T_POP)); }   // на проигрыше раскладку не досчитываем
  return n;
}
function undoMove(s){ return s.prev || s; }
// «Пузырь спасения» после переполнения: лишняя игрушка (и остаток кучки) плюс две из мыльницы (сначала того же вида)
// поднимаются в новый пузырь поверх самого низкого столбика. Игрушки не пропадают. Отмена после него ведёт к ходу до проигрыша.
function revive(s, frames){
  if (!s.lost) return null;
  const n = cloneState(s); n.prev = s.prev; n.lost = false; n.why = ''; n.revives++;
  const over = n.cup.find(t => t.id === s.overId);
  let rescue = (over ? [over] : []).concat(s.overPend || []);
  n.cup = n.cup.filter(t => t !== over);
  for (let q = 0; q < CFG.REVIVE_TAKE && n.cup.length; q++){
    let at = -1; for (let i = n.cup.length - 1; i >= 0 && at < 0; i--) if (rescue.some(r => r.k === n.cup[i].k)) at = i;
    rescue.push(n.cup.splice(at < 0 ? n.cup.length - 1 : at, 1)[0]);
  }
  rescue = groupKinds(rescue);
  let c = 0; n.cols.forEach((col, q) => { if (col.length < n.cols[c].length) c = q; });
  const ev = [];
  for (let q = 0; q < rescue.length; q += CFG.CAP){
    const b = { id: n.nid++, toys: rescue.slice(q, q + CFG.CAP) };
    if (isTriple(b.toys)){ n.triples++; ev.push({ t: 'airClear', toys: b.toys }); continue; }
    n.cols[c].push(b); ev.push({ t: 'revive', id: b.id });
  }
  delete n.overId; delete n.overPend;
  if (frames) frames.push(snap(n, null, ev, CFG.T_REVIVE));
  return n;
}

// Ключ состояния без id — для поиска (мутность на ход игры не влияет и в ключ не входит).
function stateKey(s){
  return s.cols.map(col => col.map(b => (b.lock ? 'L' : '') + (b.strong ? 'S' : '') + (b.sp ? 'G' : '') + (b.wc !== undefined ? 'W' : '')
    + b.toys.map(t => t.k).sort().join('')).join('.')).join('|') + '>' + s.cup.map(t => t.k).sort().join('') + '~' + s.valves.map(v => v.open ? 1 : 0).join('');
}
// Поиск в ширину: кратчайшее по тапам решение (список ходов) или null.
function solve(s){
  if (isWin(s)) return [];
  const seen = new Set([stateKey(s)]); let layer = [{ s, path: [] }];
  while (layer.length){
    const next = [];
    for (const node of layer){
      for (const m of legalMoves(node.s)){
        const n = applyMove(node.s, m); if (n.lost) continue;
        const k = stateKey(n); if (seen.has(k)) continue; seen.add(k);
        const path = node.path.concat(m);
        if (isWin(n)) return path;
        n.prev = null; next.push({ s: n, path });
        if (seen.size > CFG.SOLVER_MAX) return null;
      }
    }
    layer = next;
  }
  return null;
}

// Боты (PROTO-BASE §6): случайный; новичок — не делает ход, проигрывающий сразу, и берёт любой ход, который что-то
// убирает, иначе случайный; содержимое мутных пузырей он не видит (pickNoviceSee — видит, для проверки «нужности»);
// жадный — максимум убранных игрушек за ход, при равенстве меньше в стаканчике.
function pickRandom(s, rnd){ const ms = legalMoves(s); return ms[Math.floor(rnd() * ms.length)]; }
// Что видит игрок: игрушки мутных пузырей — неизвестные (вид у каждой свой, ни с чем не совпадает).
function blindView(s){
  let any = false; eachEl(s.cols, b => { if (b.murky) any = true; }); if (!any) return s;
  const m = cloneState(s); m.prev = null;
  eachEl(m.cols, b => { if (b.murky) b.toys = b.toys.map(t => ({ id: t.id, k: 100 + t.id })); });
  return m;
}
// Ходы бота: после BOT_VALVE_RUN щелчков краников подряд — только тапы по пузырям (иначе щёлкал бы вечно).
function botMoves(s){ const ms = legalMoves(s); if ((s.vrun || 0) < CFG.BOT_VALVE_RUN) return ms; const p = ms.filter(m => m < VALVE_M); return p.length ? p : ms; }
function noviceChoice(s, rnd){
  const left = toysLeft(s);
  const opts = botMoves(s).map(m => { const n = applyMove(s, m); return { m, gain: left - toysLeft(n), lose: n.lost }; });
  const safe = opts.filter(o => !o.lose), pool = safe.length ? safe : opts;
  const good = pool.filter(o => o.gain > 0), from = good.length ? good : pool;
  return from[Math.floor(rnd() * from.length)].m;
}
function pickNovice(s, rnd){ return noviceChoice(blindView(s), rnd); }
function pickNoviceSee(s, rnd){ return noviceChoice(s, rnd); }
function pickGreedy(s){
  let best = null, bs = -Infinity; const left = toysLeft(s);
  for (const m of botMoves(s)){
    const n = applyMove(s, m), sc = n.lost ? -1000 : (left - toysLeft(n)) * 10 - n.cup.length - (m >= VALVE_M ? 0.5 : 0);
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
// revives — сколько раз бот берёт «пузырь спасения» после переполнения (для метрики «спасает ли одно продолжение»).
function botRun(s, pick, seed, revives){
  const rnd = mulberry32(seed); let chainTaps = 0, revived = 0;
  for (;;){
    while (!isWin(s) && !isLose(s) && s.moves < CFG.BOT_MAX_MOVES){ s = applyMove(s, pick(s, rnd)); s.prev = null; if (s.lastChain > 0) chainTaps++; }
    if (isLose(s) && revived < (revives || 0)){ s = revive(s); revived++; continue; }
    break;
  }
  return { win: isWin(s), moves: s.moves, par: s.par, why: isWin(s) ? '' : s.why || 'stuck', chainTaps, triples: s.triples, cupClears: s.cupClears,
           airTriples: s.airTriples, cupMax: s.cupMax, maxChain: s.maxChain, revived };
}
// Доля побед новичка и среднее число троек, собранных прямо в пузыре (главное «ага» механики).
function noviceStats(s0){
  let w = 0, tri = 0;
  for (let k = 0; k < CFG.BOT_RUNS; k++){ const r = botRun(s0, pickNovice, 500 + k); w += r.win ? 1 : 0; tri += r.triples; }
  return { rate: w / CFG.BOT_RUNS, triples: tri / CFG.BOT_RUNS };
}
// Сколько тапов лучшего решения запускают цепочку (лопанье от тяжести).
function pathChains(s, path){ let n = 0; for (const m of path){ s = applyMove(s, m); if (s.lastChain > 0) n++; } return n; }
function randomRate(s0){ let w = 0; for (let k = 0; k < CFG.BOT_RUNS; k++) w += botRun(s0, pickRandom, 900 + k).win ? 1 : 0; return w / CFG.BOT_RUNS; }
function randomRun(li, seed){ return botRun(createState(li), pickRandom, seed); }
function noviceRun(li, seed, revives){ return botRun(createState(li), pickNovice, seed, revives); }
function greedyRun(li){ return botRun(createState(li), pickGreedy, 1); }

// Оболочка: экраны, ввод, рендер, звук, сейв, дебаг-хук. Время абсолютное (§4): now() = performance.now() + skew.
// ---------------------------------------------------------------------------
const NAME = 'pena-v-vanne';
const T0 = performance.now();
function log(kind, name, info){            // журнал [game] — одна строка на событие (§11)
  console.log('[game] ' + JSON.stringify({ t: +((now() - T0) / 1000).toFixed(3), kind, name, info: info === undefined ? '' : String(info) }));
}

const SAVE_KEY = NAME + '.v1';
function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) {} }

const G = {
  s: null,                       // состояние ядра (уже после последнего хода)
  screen: 'menu',                // menu | game | win | lose | help
  save: Object.assign({ level: 0, muted: false, best: {}, unlockAll: false, seenTips: {}, undos: CFG.UNDO_START }, loadSave()),   // unlockAll — чит (PROTO-BASE §6); undos — бустер «Отмена»
  anim: null,                    // проигрывание хода: { frames, starts, end, k }
  fx: [],                        // эффекты: { type, t0, until, … } — дедлайны в абсолютном времени
  wob: {},                       // id тугого пузыря → когда начал дрожать
  ending: 0,                     // когда показать win/lose, 0 = не ждём
  hintMove: -1,                  // подсказка-палец на обучающих уровнях
  squash: {},                    // id игрушки → когда приземлилась (сплющивание)
  press: null,                   // { id, t } — пузырь под пальцем (вдавливается до отпускания)
  combo: 0,                      // троек за текущий ход (подпись «комбо»)
  valveAnim: {},                 // номер краника → когда щёлкнул / пропустил поток (качание ручки)
  timeScale: 1,
  paused: false,
  skew: 0,                       // сдвиг часов для drive(): ручной прогон игрового времени
  maxH: 3,                       // высота самого высокого столбика (для раскладки; растёт от крепкого и «пузыря спасения»)
  reviveUsed: false,             // «пузырь спасения» уже брали на этом уровне (один раз за уровень)
  extraSlot: false,              // уровень начат с «+1 место в мыльнице»
  offer: null,                   // открытое предложение монетизации: { type, back } — для журнала decline
  monet: {},                     // счётчики monet.* за сеанс (offer/accept/decline по типам) — PENA_V_VANNE.monet()
};
// Монетизация в прототипе — заглушки: «реклама» выдаёт награду сразу, всё пишется в журнал monet.* (мерить, где игрок упирается).
function monet(kind, type, info){ const k = kind + ':' + type; G.monet[k] = (G.monet[k] || 0) + 1; log('event', 'monet.' + kind, 'type=' + type + ' level=' + (G.s ? G.s.li + 1 : 0) + (info ? ' ' + info : '')); }
function now(){ return performance.now() + G.skew; }

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const Snd = {
  ac: null, noise: null,
  init(){
    if (!this.ac){
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();

function tapMove(m){

        const p = lay.get(toy.id); if (!p) continue;

        else G.fx.push({ type: 'clear', x: p.x, y: p.y, s: p.s, k: toy.k, t0: t, until: t + 480 / G.timeScale });
      }
      if (mid) setTimeout(() => spawnSparks(mid.x, mid.y, mid.z || 0, 18, 1.1), 150 / G.timeScale);
      const p0 = mid;
      if (p0) triple(air ? (e.t === 'wideClear' ? p0.x : W / 2) : p0.x, air ? p0.y - GEO.r * 1.9 : GEO.cupY - GEO.cupH * 0.8, e.t === 'wideClear' ? '×3' : air ? '×3 на лету!' : '×3');
      log('event', e.t === 'wideClear' ? 'wide.triple' : air ? 'air.triple' : 'cup.clear', 'kind=' + KIND_NAMES[e.toys[0].k]);
    } else if (e.t === 'overflow'){
      Snd.over(); buzz(80); G.fx.push({ type: 'shake', amp: 10, t0: t, until: t + 480 / G.timeScale });
      log('event', 'overflow');
    }
  }
}
function finishEnding(){
  G.ending = 0;
  if (isWin(G.s)){
    const li = G.s.li, m = G.s.moves, p = G.s.par;
    const stars = m <= p ? 3 : m <= p + CFG.STAR2_SLACK ? 2 : 1;
    G.save.best[li] = Math.max(G.save.best[li] || 0, stars);
    G.save.level = Math.max(G.save.level, Math.min(li + 1, LEVELS.length - 1)); save();
    Snd.win(); buzz([20, 40, 20]); spawnConfetti(V3.CONFETTI);
    log('event', 'reward', 'stars=' + stars);
    goto('win', { stars: starStr(stars), text: 'Тапов: ' + m + ' · лучший путь: ' + p + (G.s.maxChain ? ' · цепочка ×' + (G.s.maxChain + 1) : '') });
  } else { Snd.lose(); goto('lose'); }
}
function undo(){
  if (!G.s || !G.s.prev) return;
  G.s = undoMove(G.s); G.anim = null; G.ending = 0; G.fx = []; log('input', 'undo'); hud();
}
// Бустер «Отмена»: тратит одну из запаса; запас пуст — предложение «+1 за рекламу».
function useUndo(){
  if (!G.s || !G.s.prev) return;
  if (G.save.undos <= 0){ goto('undoOffer', G.screen === 'lose' ? 'lose' : 'game'); return; }
  G.save.undos--; save(); log('event', 'booster', 'undo left=' + G.save.undos);
  if (G.screen !== 'game') goto('game');
  undo();
}
// «Пузырь спасения» (за рекламу, один раз за уровень): лишние игрушки поднимаются в новый пузырь.
function doRevive(){
  if (!G.s || !G.s.lost || G.reviveUsed) return;
  monet('accept', 'revive');
  const frames = [snap(G.s, G.s.overPend && G.s.overPend.length ? { cup: true, toys: G.s.overPend } : null, [], 0)];
  const n = revive(G.s, frames); if (!n) return;
  G.s = n; G.reviveUsed = true; G.ending = 0; regrow();
  goto('game'); startAnim(frames); hud();
  log('event', 'revive', 'cup=' + n.cup.length + '/' + n.cap);
}

// --- геометрия: виртуальная ширина VW, всё в виртуальных юнитах (§2) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = 400;
let scale = 1, W = VW, H = 600, DPR = 1, GEO = null;
function computeGeo(){
  const nc = G.s ? G.s.cols.length : 3;
  const cupH = 84, cupY = H - 14 - cupH / 2;                  // центр мыльницы
  const waterY = cupY - cupH / 2 - 32;                        // поверхность воды
  const colW = Math.min(124, (W - 14) / nc);
  let r = Math.min(58, colW * 0.47);                          // пузыри крупнее: поле занимает всю высоту
  r = Math.min(r, (waterY - 80) / (G.maxH * 1.8 + 0.2));      // сверху запас под всплывающие подписи
  const step = r * 1.8;                                       // шаг пузырей в столбике (лёгкое перекрытие пены)
  return { nc, colW, r, step, waterY, baseY: waterY - r - 10, cupY, cupH };   // низ пузыря на 10 px выше воды и пены
}
function bubbleXY(c, i){ return { x: W / 2 + (c - (GEO.nc - 1) / 2) * GEO.colW, y: GEO.baseY - i * GEO.step }; }   // c и i могут быть дробными
// Краник на стене: в ромбе между четырьмя пузырями — посередине между столбиками c и to, на высоте k (между рядами k−1 и k).
function valveXY(v){ return { x: (bubbleXY(v.c, 0).x + bubbleXY(v.to, 0).x) / 2, y: GEO.baseY - (v.k - 0.5) * GEO.step, dir: Math.sign(v.to - v.c) }; }
const WIDE_K = () => (GEO.colW / 2 + GEO.r * 0.92) / GEO.r;      // широкий пузырь: полуширина в радиусах
const VALVE_R = 0.5;                                             // радиус касания краника в долях радиуса пузыря
const TOY_K = 0.38;                                         // размер игрушки в долях радиуса пузыря (когда их три)
const TOY_BY_N = [0, 0.46, 0.38, 0.28];                     // одна ≈0,62 D, две ≈0,44 D, три ≈0,36 D (видимый размер = TOY_FIT × s)
// Места игрушек внутри пузыря (доли радиуса): 1, 2 или 3 штуки.
const SLOT_OFS = [[], [[0, 0.04]], [[-0.45, 0.08], [0.45, 0.08]], [[-0.4, 0.26], [0.4, 0.26], [0, -0.33]]];
// Гнёзда мыльницы: ровно cap мест, позиции не зависят от числа игрушек (игрушка всегда встаёт в своё гнездо).
// hoverY — ряд над мыльницей: там висит падающая кучка и лишняя игрушка при переполнении.
function cupSlots(n, cap){
  const sw = Math.min(78, (W - 60) / cap), w = cap * sw + 34, x0 = W / 2 - (cap * sw) / 2;
  return { w, sw, x: (i) => x0 + sw * (i + 0.5), y: GEO.cupY, s: sw * 0.29, hoverY: GEO.cupY - GEO.cupH * 0.98,
           hx: (i, n2) => W / 2 + (i - (n2 - 1) / 2) * sw * 0.72 };
}
// Раскладка снимка: id → { x, y, s } (для пузыря s — радиус, для игрушки — размер).
function layoutFrame(F){
  const m = new Map(), r = GEO.r, ts = r * TOY_K;   // ts — размер игрушек в полёте
  eachEl(F.cols, (b, c, i) => {
    if (b.wc !== undefined){                                  // широкий: под двумя столбиками, игрушки в ряд
      const p = bubbleXY(b.wc + 0.5, 0), n = b.toys.length, kx = WIDE_K();
      m.set(b.id, { x: p.x, y: p.y, s: r, wide: kx, bubble: true });
      b.toys.forEach((t, k) => m.set(t.id, { x: p.x + (k - (n - 1) / 2) * r * Math.min(0.62, (kx * 1.5) / Math.max(1, n)), y: p.y + (k % 2 ? -0.16 : 0.14) * r, s: r * 0.34, k: t.k }));
      return;
    }
    const p = bubbleXY(c, i);
    if (b.sp){                                                // губка: игрушка (одна) перед губкой
      m.set(b.id, { x: p.x, y: p.y, s: r, sp: true, bubble: true });
      b.toys.forEach(t => m.set(t.id, { x: p.x, y: p.y - r * 0.05, s: r * 0.4, k: t.k, z: 0.75 }));
      return;
    }
    m.set(b.id, { x: p.x, y: p.y, s: r, lock: !!b.lock, murky: !!b.murky, strong: !!b.strong, n: b.toys.length, bubble: true });
    const ofs = SLOT_OFS[Math.min(3, b.toys.length)];
    const bs = r * TOY_BY_N[Math.min(3, b.toys.length)];
    b.toys.forEach((t, k) => m.set(t.id, { x: p.x + ofs[k][0] * r, y: p.y + ofs[k][1] * r, s: bs, k: t.k, hidden: !!b.murky }));
  });
  const cs = cupSlots(F.cup.length, F.cap);
  if (F.air && F.air.cup){                                    // кучка висит над мыльницей
    F.air.toys.forEach((t, k) => m.set(t.id, { x: cs.hx(k, F.air.toys.length), y: cs.hoverY, s: cs.s, k: t.k, z: V3.CUP_Z + 0.75, air: true }));
  } else if (F.air){
    const p = bubbleXY(F.air.c, F.air.at), n = F.air.toys.length, per = 3;
    F.air.toys.forEach((t, k) => {
      const row = Math.floor(k / per), inRow = Math.min(per, n - row * per), col = k % per;
      m.set(t.id, { x: p.x + (col - (inRow - 1) / 2) * ts * 2.25, y: p.y + row * ts * 1.9 - (Math.ceil(n / per) - 1) * ts * 0.95, s: ts, k: t.k });
    });
  }
  // Стаканчик полон, а прилетела ещё одна (собирает тройку или переполняет): новенькая не сдвигает соседей, а встаёт
  // над своей парой (или над серединой), остальные стоят в своих гнёздах.
  const ev = F.ev || [];                                     // у итогового кадра (после анимации) событий может не быть
  const extra = F.cup.length > F.cap ? (ev.find(e => (e.t === 'cup' || e.t === 'overflow') && e.id) || {}).id : undefined;
  let slot = 0, spill = 0;
  const spillN = Math.max(0, F.cup.length - (extra !== undefined ? 1 : 0) - F.cap);
  F.cup.forEach((t) => {
    if (t.id === extra) return;
    if (slot < F.cap) m.set(t.id, { x: cs.x(slot), y: cs.y, s: cs.s, k: t.k, z: V3.CUP_Z + 0.75, cup: true });
    else m.set(t.id, { x: cs.hx(spill++, spillN), y: cs.hoverY, s: cs.s, k: t.k, z: V3.CUP_Z + 0.75, over: true });   // сверх мест (страховка)
    slot++;
  });
  if (extra !== undefined){
    const t = F.cup.find(x => x.id === extra), mates = F.cup.filter(x => x.k === t.k && x.id !== extra).map(x => m.get(x.id)).filter(Boolean);
    const gx = mates.length ? mates.reduce((a, q) => a + q.x, 0) / mates.length : W / 2;
    m.set(extra, { x: gx, y: cs.y - cs.sw * 0.62, s: cs.s, k: t.k, z: V3.CUP_Z + 0.95, over: ev.some(e => e.t === 'overflow') });
  }
  return m;
}

// --- ввод: Pointer Events, порог тап/драг 10 px, pointercancel = pointerup (§3) ---
let down = null;
function toVirtual(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// Что под пальцем: краник (проверяется первым — он маленький и стоит между пузырями), иначе ближайший элемент.
function bubbleAt(p){
  if (!G.s || !GEO) return null;
  for (let q = 0; q < G.s.valves.length; q++){ const v = valveXY(G.s.valves[q]); if (Math.hypot(p.x - v.x, p.y - v.y) < GEO.r * VALVE_R * 1.25) return { valve: q }; }
  let best = null, bd = Infinity;
  eachEl(G.s.cols, (b, c, i) => {
    const q = b.wc !== undefined ? bubbleXY(b.wc + 0.5, 0) : bubbleXY(c, i);
    const kx = b.wc !== undefined ? WIDE_K() : 1, d = Math.hypot((p.x - q.x) / kx, p.y - q.y);
    if (d < GEO.r * 1.08 && d < bd){ bd = d; best = { c, i, id: b.id }; }
  });
  return best;
}
cv.addEventListener('pointerdown', (e) => { Snd.init(); down = toVirtual(e); down.id = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const hit = bubbleAt(down); if (hit && G.s && !G.ending){ G.press = { id: hit.valve !== undefined ? 'v' + hit.valve : hit.id, t: now() }; Snd.press(); } });
function onUp(e){
  if (!down || e.pointerId !== down.id) return;
  const p = toVirtual(e), moved = Math.hypot(p.x - down.x, p.y - down.y) > 10 / scale;
  const start = down; down = null; G.press = null;
  if (moved || e.type === 'pointercancel') return;
  const hit = bubbleAt(start); if (!hit) return;
  if (hit.valve !== undefined) tapValve(hit.valve); else tapBubble(hit.c, hit.i);
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {          // дубли на клавиатуру для отладки (§3): цифра — верхний тапабельный пузырь столбика
  if (e.key >= '1' && e.key <= '9' && G.s){
    const c = +e.key - 1, col = G.s.cols[c]; if (!col) return;
    for (let i = col.length - 1; i >= 0; i--) if (canTap(G.s, c, i)){ tapBubble(c, i); break; }
  }
  if (e.key === 'z' || e.key === 'u') useUndo();
  if (e.key === 'v' && G.s && G.s.valves.length) tapValve(0);
  if (e.key === 'r' && G.s) startLevel(G.s.li);
  if (e.key === 'm') goto('menu');
  if (e.key === 'h' && G.s){ G.hintMove = (solve(G.s) || [])[0] ?? -1; }
});
$('btn-undo').onclick = () => { log('input', 'button', 'undo'); useUndo(); };
$('btn-reset').onclick = () => { log('input', 'button', 'reset'); startLevel(G.s ? G.s.li : 0); };
$('btn-menu').onclick = () => { log('input', 'button', 'menu'); goto('menu'); };
$('btn-mute').onclick = () => { Snd.init(); G.save.muted = !G.save.muted; save(); hud(); log('input', 'button', 'mute=' + G.save.muted); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
let PAL = null;
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  scale = r.width / VW; W = VW; H = r.height / scale;
  const cw = Math.round(r.width * DPR), ch = Math.round(r.height * DPR);
  if (cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
  GEO = computeGeo(); PAL = readPalette();
  if (R3.ok){ R3.renderer.setPixelRatio(DPR); R3.renderer.setSize(r.width, r.height, false); }
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// --- рендер: всё в canvas, цвета из CSS-переменных (§9) ---
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function readPalette(){
  const p = {};
  for (const k of ['wall', 'grout', 'tub', 'tub-shade', 'water', 'water-hi', 'foam', 'bubble', 'bubble-hard', 'rim', 'rim-hard', 'cup', 'cup-rim', 'slot',
    'outline', 'beak', 'belly', 'white', 'danger', 'accent', 'ink']) p[k] = css('--' + k);
  p.toys = [0, 1, 2, 3, 4, 5].map(i => css('--toy' + i));
  return p;
}
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - (1 - p) * (1 - p);
const easeIn = (p) => p * p;

function render(){
  const t = now();
  if (!PAL || !GEO) fit();
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
  if (R3.ok) ctx.clearRect(0, 0, W, H); else drawBathroom(ctx);
  // какой кадр хода показываем
  let A = null, B = null, p = 1;
  if (G.s && G.anim){
    const a = G.anim;
    while (a.k + 1 < a.frames.length && t >= a.starts[a.k + 1]){ a.k++; fireEvents(a.frames[a.k], a.frames[a.k - 1]); }
    if (t >= a.end){ G.anim = null; log('fx.end', 'move'); }
    else { A = a.frames[a.k - 1]; B = a.frames[a.k]; p = Math.min(1, (t - a.starts[a.k]) / (B.dur / G.timeScale)); }
  }
  if (G.s && !B){ A = B = { cols: G.s.cols, cup: G.s.cup, cap: G.s.cap, valves: G.s.valves.map(v => v.open),
                            air: G.s.lost && G.s.overPend && G.s.overPend.length ? { cup: true, toys: G.s.overPend } : null,
                            ev: G.s.lost && G.s.overId ? [{ t: 'overflow', id: G.s.overId }] : [] }; }
  const view = B ? buildView(A, B, p, t) : null;
  if (R3.ok) draw3D(view, t); else if (view) draw2D(view, t);
  if (view) drawBadges(ctx, view, t);
  G.fx = G.fx.filter(f => f.until > t);
  for (const f of G.fx) if (!R3.ok || f.type === 'text' || f.type === 'unlock') drawFx(ctx, f, t);
  if (!G.s) return;
  // подсказка-палец на обучающих уровнях
  if (G.hintMove >= 0 && !G.anim){
    const c = G.hintMove >> 4, i = G.hintMove & 15;
    if (G.s.cols[c] && G.s.cols[c][i]){ const q = bubbleXY(c, i); drawFinger(ctx, q.x + GEO.r * 0.78, q.y + GEO.r * 0.72, t); }
  }
  if (G.ending && t >= G.ending && !G.anim) finishEnding();
  if (toastUntil && t > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}
// Срез кадра для отрисовки: позиции пузырей и игрушек между двумя снимками хода, «желе» и сплющивание по времени.
function buildView(A, B, p, t){
  const LA = A === B ? null : layoutFrame(A), LB = layoutFrame(B);
  const pos = (id, ease) => { const b = LB.get(id), a = LA && LA.get(id) || b, e = ease(p); return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), s: lerp(a.s, b.s, e), z: lerp(a.z || 0, b.z || 0, e) }; };
  const jelly = (t0) => { if (t0 === undefined || t < t0) return 0; const q = (t - t0) / CFG.JELLY_MS; return q >= 1 ? 0 : Math.sin(q * Math.PI * 3) * (1 - q); };
  const bubbles = [];
  eachEl(B.cols, (b) => {
    const q = pos(b.id, easeOut), w = jelly(G.wob[b.id]), lb = LB.get(b.id);
    if (G.wob[b.id] !== undefined && t > G.wob[b.id] + CFG.JELLY_MS) delete G.wob[b.id];
    const press = G.press && G.press.id === b.id ? Math.min(1, (t - G.press.t) / 90) : 0;
    bubbles.push({ id: b.id, x: q.x, y: q.y, r: q.s * (1 - 0.08 * press), jelly: w, lock: lb.lock, murky: lb.murky, strong: lb.strong, wide: lb.wide || 0, sp: !!lb.sp, n: lb.n || 0 });
  });
  const air = new Set(B.air ? B.air.toys.map(x => x.id) : []);
  const toys = [];
  const addToy = (toy) => { const q = pos(toy.id, easeIn); const lb = LB.get(toy.id); toys.push({ id: toy.id, k: toy.k, x: q.x, y: q.y, s: q.s, z: q.z, cup: !!lb.cup && p >= 1 || (!!lb.cup && LA && LA.get(toy.id) && LA.get(toy.id).cup), over: !!lb.over, air: air.has(toy.id) || (LA && LA.get(toy.id) && LA.get(toy.id).x !== lb.x), squash: jelly(G.squash[toy.id]), hidden: !!lb.hidden }); };
  eachEl(B.cols, b => b.toys.forEach(addToy));
  if (B.air) B.air.toys.forEach(addToy);
  B.cup.forEach(addToy);
  let shake = 0; for (const f of G.fx) if (f.type === 'shake' && t < f.until) shake = Math.max(shake, f.amp * (1 - (t - f.t0) / (f.until - f.t0)));
  const valves = G.s.valves.map((v, q) => Object.assign(valveXY(v), { q, open: B.valves ? B.valves[q] : v.open,
    press: G.press && G.press.id === 'v' + q ? 1 : 0, swing: G.valveAnim[q] !== undefined ? Math.max(0, 1 - (t - G.valveAnim[q]) / 400) : 0 }));
  return { bubbles, toys, valves, cup: { n: B.cup.length, cap: B.cap }, shake };
}
// 2D-запасной рендер (нет WebGL): те же данные, плоские фигуры.
function draw2D(v, t){
  const sh = Math.sin(t * 0.06) * v.shake;
  drawCup(ctx, W / 2 + sh, GEO.cupY, cupSlots(v.cup.n, v.cup.cap), v.cup.cap, v.cup.n >= v.cup.cap, v.cup.n > v.cup.cap);
  const each = (fn) => { for (const q of v.bubbles){ if (q.sp) continue; ctx.save(); ctx.translate(q.x, q.y); ctx.scale(q.wide || 1, 1); fn(q); ctx.restore(); } };
  for (const q of v.bubbles) if (q.sp) drawSponge2D(ctx, q.x, q.y, q.r * (1 + 0.06 * q.jelly));
  each(q => drawBubbleBack(ctx, 0, 0, q.r * (1 + 0.06 * q.jelly), q.strong, q.murky));
  for (const q of v.toys) if (!q.hidden) drawToy(ctx, q.k, q.x, q.y, q.s * (1 + 0.15 * q.squash));
  each(q => drawBubbleFront(ctx, 0, 0, q.r * (1 + 0.06 * q.jelly), q.strong));
  for (const q of v.valves) drawValve2D(ctx, q);
}

// ---------------------------------------------------------------------------
// 3D-слой (three.js 0.185.1). Камера смотрит в лоб: плоскость z = 0 проецируется ровно в виртуальную 2D-раскладку,
// поэтому ядро, попадание тапа и подписи остаются в виртуальных координатах, а W3() переводит точку на любой глубине

function clear3D(){

function W3(x, y, z){
  const U = V3.U, k = (V3.D - z) / V3.D;

// Стена (текстура-канвас: тёмная бирюза, крупная плитка, боке, виньетка), ванна в три слоя, вода, пена, мыльница.

const SCENE_PAL = {
  wallTop: '#2a5f6b', wallBot: '#4f8f97', grout: 'rgba(10,40,48,.16)', tileHi: 'rgba(255,255,255,.05)',
  tubPanel: 0xdce9e6, tubRim: 0xfff3de, water: 0x4fa3b8, foam: 0xf3faf7,

function paintWall(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 1024); gr.addColorStop(0, SCENE_PAL.wallTop); gr.addColorStop(1, SCENE_PAL.wallBot);

  g.strokeStyle = SCENE_PAL.grout; g.lineWidth = 3;
  for (let x = tile * 0.4; x < 512; x += tile){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke(); }
  for (let y = 1024 - tile * 0.3; y > 0; y -= tile){ g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  const rnd = mulberry32(5);                                 // боке: мягкие световые пятна

    const x = rnd() * 512, y = rnd() * 640, r = 30 + rnd() * 70, rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(210,255,250,' + (0.07 + rnd() * 0.08) + ')'); rg.addColorStop(1, 'rgba(210,255,250,0)');

  vg.addColorStop(0, 'rgba(0,20,28,0)'); vg.addColorStop(1, 'rgba(0,20,28,.45)'); g.fillStyle = vg; g.fillRect(0, 0, 512, 1024);

}

// Пена (детерминированно от номера уровня): облака за плоскостью пузырей + кучки по краям экрана спереди.

    m.material = b.murky ? R3.matMurky : b.strong ? R3.matStrong : R3.matBub;
    const [x, y] = W3(b.x, b.y + bob, 0), kx = b.wide || 1;
    m.position.set(x, y, 0); m.scale.set(s * kx * (1 + 0.07 * b.jelly), s * (1 - 0.07 * b.jelly), s * (1 + 0.07 * b.jelly));
    seenB.add(b.id);
  }
  for (const [id, m] of R3.bubObj) if (!seenB.has(id)){ R3.scene.remove(m); R3.bubObj.delete(id); }
  for (const [id, g] of R3.spObj) if (!seenS.has(id)){ R3.scene.remove(g); R3.spObj.delete(id); }
  // краники: на стене в ромбе между пузырями; ручка вдоль носика и струйка — открыт, ручка поперёк и красная — закрыт
  if (v) v.valves.forEach((q) => {
    let g = R3.valveObj[q.q];
    if (!g){ g = makeValve(); R3.scene.add(g); R3.valveObj[q.q] = g; }
    const s = GEO.r * VALVE_R * U / 0.62 * (1 - 0.1 * q.press), [x, y, z] = W3(q.x, q.y, 1.2);
    g.position.set(x, y, z); g.scale.set(s * q.dir, s, s);
    const u = g.userData, sw = Math.sin(q.swing * Math.PI * 3) * q.swing * 0.5;
    u.hd.rotation.z = (q.open ? 0 : Math.PI / 2) + sw;              // открыт — рычаг вдоль носика, закрыт — торчит вверх
    u.lever.material = q.open ? R3.valveOpen : R3.valveShut;
    u.water.visible = q.open; u.water.scale.set(1, 0.85 + 0.15 * Math.sin(t * 0.03 + q.q), 1);
    u.drop.visible = q.open; u.drop.position.y = -0.55 - ((t * 0.0022 + q.q * 0.37) % 1) * 1.1;
  });
  // игрушки
  const seenT = new Set();
  if (v) for (const q of v.toys){
    if (q.hidden) continue;                                     // в мутном пузыре игрушки не видны
    let o = R3.toyObj.get(q.id);
    if (o && o.userData.k !== q.k){ R3.scene.remove(o); o = null; }          // id игрушек начинаются заново на каждом уровне — сверять вид
    if (!o){ o = R3.models[q.k].clone(); o.userData.k = q.k; R3.scene.add(o); R3.toyObj.set(q.id, o); }
    const still = q.cup && !q.air, shiver = q.over ? Math.sin(t * 0.06) * 3 : 0;
    const bob = still ? 0 : Math.sin(t * 0.0016 + q.id * 0.9) * 1.2, [x, y, z] = W3(q.x + shiver, q.y + bob, q.z), s = q.s * U * V3.TOY_FIT * ((V3.D - q.z) / V3.D);
    o.position.set(x, y, z + 0.05);
    const sq = q.squash;
    o.scale.set(s * (1 + 0.18 * sq), s * (1 - 0.22 * sq), s * (1 + 0.18 * sq));
    o.rotation.set(0, still ? 0.3 : Math.sin(t * 0.0011 + q.id) * 0.45 + 0.25, q.air ? Math.sin(t * 0.02 + q.id) * 0.25 : 0);
    seenT.add(q.id);
  }
  for (const [id, o] of R3.toyObj) if (!seenT.has(id)){ R3.scene.remove(o); R3.toyObj.delete(id); }
  // эффекты: улетающие тройки, хлопки игрушек, кольца, частицы
  R3.flyers = R3.flyers.filter(f => {
    const q = (t - f.t0) / f.dur;
    if (q >= 1){ R3.scene.remove(f.grp); spawnSparks(f.x, f.y - 150, 0, 22, 1.2); spawnPop(f.x, f.y - 150, f.r, 1); return false; }
    const [x, y] = W3(f.x, f.y - 150 * easeIn(q), 0), s = f.r * U * (1 + 0.25 * Math.sin(q * Math.PI));
    f.grp.position.set(x, y, 0.3); f.grp.scale.setScalar(s); f.grp.rotation.y = q * 4;
    f.mat.uniforms.uTime.value = t / 1000; f.mat.uniforms.uAlpha.value = 1 - q * 0.4;
    return true;
  });
  R3.pops = R3.pops.filter(p => {
    const q = (t - p.t0) / p.dur;
    if (q >= 1){ R3.scene.remove(p.m); return false; }
    // 0–0,4: съезжается к цели; 0,4–0,6: вздувается; 0,6–1: лопается в ноль
    const mv = easeOut(Math.min(1, q / 0.4)), px = lerp(p.x, p.tx, mv), py = lerp(p.y, p.ty, mv);
    const k = q < 0.4 ? 1 : q < 0.6 ? 1 + (q - 0.4) / 0.2 * 0.35 : 1.35 * (1 - (q - 0.6) / 0.4);
    const [x, y, z] = W3(px, py, p.z), s = p.s * U * V3.TOY_FIT * k;
    p.m.position.set(x, y, z + 0.3); p.m.scale.setScalar(Math.max(0.0001, s)); p.m.rotation.y = 0.3 + (q > 0.4 ? (q - 0.4) * 8 : 0);
    return true;
  });
  for (const r of R3.rings){ if (!r.mesh.visible) continue; const q = (t - r.t0) / r.dur; if (q >= 1){ r.mesh.visible = false; continue; } r.mesh.scale.setScalar(lerp(r.r0, r.r1, easeOut(q))); r.mesh.material.opacity = 0.9 * (1 - q); }
  updatePool(R3.drops, t); updatePool(R3.sparks, t); updatePool(R3.conf, t);
  R3.renderer.render(R3.scene, cam);
}

// Стена в плитку и ванна с водой и пеной (фон; от W, H, GEO.waterY).
function drawBathroom(c){
  c.fillStyle = PAL.wall; c.fillRect(0, 0, W, H);
  c.strokeStyle = PAL.grout; c.lineWidth = 2;
  for (let x = 20; x < W; x += 44){ c.beginPath(); c.moveTo(x, 0); c.lineTo(x, GEO.waterY); c.stroke(); }
  for (let y = GEO.waterY - 10; y > 0; y -= 44){ c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  const wy = GEO.waterY;
  // вода
  c.fillStyle = PAL.water; c.beginPath(); c.moveTo(0, wy + 4);
  for (let x = 0; x <= W; x += 20) c.quadraticCurveTo(x + 10, wy - 3, x + 20, wy + 4);
  c.lineTo(W, wy + 26); c.lineTo(0, wy + 26); c.closePath(); c.fill();
  // корпус ванны
  c.fillStyle = PAL.tub; c.beginPath(); c.roundRect(-10, wy + 18, W + 20, H - wy, 22); c.fill();
  c.fillStyle = PAL['tub-shade']; c.fillRect(0, wy + 30, W, 4);
  // пена у воды — статичные шапки под столбиками (без случайности по кадрам)
  c.fillStyle = PAL.foam;
  if (G.s) for (let k = 0; k < GEO.nc; k++){
    const x = bubbleXY(k, 0).x, r = GEO.r;
    for (const [dx, dr] of [[-0.8, 0.32], [-0.35, 0.42], [0.25, 0.4], [0.75, 0.3]]){ c.beginPath(); c.arc(x + dx * r, wy + 6, dr * r, 0, Math.PI * 2); c.fill(); }
  }
}
// Пузырь: прозрачная заливка (рисуется до игрушек). Крепкий — плотнее, мутный — молочный.
function drawBubbleBack(c, x, y, r, hard, murky){
  c.fillStyle = murky ? 'rgba(214,226,242,.9)' : hard ? PAL['bubble-hard'] : PAL.bubble;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}
// Пузырь: ободок и блик (поверх игрушек). Крепкий (hard) — второй ободок с насечками (не только цвет, §9).
function drawBubbleFront(c, x, y, r, hard){
  c.lineWidth = r * 0.07; c.strokeStyle = hard ? PAL['rim-hard'] : PAL.rim;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
  if (hard){
    c.lineWidth = r * 0.05; c.beginPath(); c.arc(x, y, r * 0.86, 0, Math.PI * 2); c.stroke();
    c.lineWidth = r * 0.06;
    for (let a = 0; a < 8; a++){ const ang = a * Math.PI / 4 + 0.2; c.beginPath(); c.moveTo(x + Math.cos(ang) * r * 0.86, y + Math.sin(ang) * r * 0.86); c.lineTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r); c.stroke(); }
  }
  c.strokeStyle = PAL.white; c.lineWidth = r * 0.1; c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, r * 0.72, Math.PI * 1.08, Math.PI * 1.38); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.arc(x - r * 0.18, y - r * 0.74, r * 0.06, 0, Math.PI * 2); c.fill();
  c.lineCap = 'butt';
}
// Стаканчик под ванной: cap мест-кружков; полный — красный ободок, переполнен — красная заливка.
function drawCup(c, cx, cy, cs, cap, danger, over){
  const w = cs.w, h = GEO.cupH;
  c.fillStyle = over ? PAL.danger : PAL.cup; c.strokeStyle = danger ? PAL.danger : PAL['cup-rim']; c.lineWidth = 4;
  c.beginPath(); c.moveTo(cx - w / 2, cy - h / 2); c.lineTo(cx + w / 2, cy - h / 2); c.lineTo(cx + w / 2 - 10, cy + h / 2); c.lineTo(cx - w / 2 + 10, cy + h / 2); c.closePath();
  c.fill(); c.stroke();
  c.fillStyle = PAL.slot;
  for (let i = 0; i < cap; i++){ c.beginPath(); c.arc(cs.x(i) + (cx - W / 2), cs.y, cs.s * 1.25, 0, Math.PI * 2); c.fill(); }
}
// Игрушки — плоские фигуры с обводкой; каждый вид отличается и формой, не только цветом (§9).
function drawToy(c, k, x, y, s){
  c.save(); c.translate(x, y); c.lineWidth = Math.max(1.4, s * 0.13); c.strokeStyle = PAL.outline; c.lineJoin = 'round';
  const col = PAL.toys[k];
  if (k === 0) drawDuck(c, s, col); else if (k === 1) drawWhale(c, s, col); else if (k === 2) drawFish(c, s, col);
  else if (k === 3) drawFrog(c, s, col); else if (k === 4) drawBoat(c, s, col); else drawStar(c, s, col);
  c.restore();
}
function eye(c, x, y, r){ c.fillStyle = PAL.outline; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function drawDuck(c, s, col){            // утёнок: тело, голова, клюв, крыло
  c.fillStyle = col;
  c.beginPath(); c.ellipse(-0.12 * s, 0.28 * s, 0.85 * s, 0.55 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.arc(0.32 * s, -0.36 * s, 0.44 * s, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = PAL.beak; c.beginPath(); c.moveTo(0.68 * s, -0.42 * s); c.lineTo(1.05 * s, -0.28 * s); c.lineTo(0.68 * s, -0.14 * s); c.closePath(); c.fill(); c.stroke();
  eye(c, 0.42 * s, -0.46 * s, 0.09 * s);
  c.beginPath(); c.ellipse(-0.25 * s, 0.22 * s, 0.38 * s, 0.2 * s, -0.25, 0, Math.PI); c.stroke();
}
function drawWhale(c, s, col){           // кит: хвост, тело, светлое брюхо, фонтанчик
  c.fillStyle = col;
  c.beginPath(); c.moveTo(-0.6 * s, 0.15 * s); c.lineTo(-1.02 * s, -0.32 * s); c.lineTo(-0.9 * s, 0.1 * s); c.lineTo(-1.02 * s, 0.45 * s); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(0.1 * s, 0.15 * s, 0.82 * s, 0.56 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = PAL.belly; c.beginPath(); c.ellipse(0.18 * s, 0.44 * s, 0.52 * s, 0.17 * s, 0, 0, Math.PI * 2); c.fill();
  eye(c, 0.52 * s, 0.02 * s, 0.09 * s);
  c.strokeStyle = col; c.lineWidth = 0.14 * s; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0.1 * s, -0.45 * s); c.quadraticCurveTo(0, -0.85 * s, -0.25 * s, -0.8 * s);
  c.moveTo(0.1 * s, -0.45 * s); c.quadraticCurveTo(0.2 * s, -0.85 * s, 0.45 * s, -0.8 * s); c.stroke(); c.lineCap = 'butt';
}
function drawFish(c, s, col){            // рыбка: тело, хвост-треугольник, плавник, глаз
  c.fillStyle = col;
  c.beginPath(); c.moveTo(0.5 * s, 0); c.lineTo(1.02 * s, -0.48 * s); c.lineTo(1.02 * s, 0.48 * s); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(-0.12 * s, 0, 0.75 * s, 0.52 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(0.05 * s, -0.3 * s); c.quadraticCurveTo(0.3 * s, 0, 0.05 * s, 0.3 * s); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.arc(-0.48 * s, -0.12 * s, 0.17 * s, 0, Math.PI * 2); c.fill(); eye(c, -0.5 * s, -0.12 * s, 0.08 * s);
}
function drawFrog(c, s, col){            // лягушка: круглое тело, два глаза-бугорка, улыбка
  c.fillStyle = col;
  c.beginPath(); c.arc(-0.38 * s, -0.48 * s, 0.3 * s, 0, Math.PI * 2); c.arc(0.38 * s, -0.48 * s, 0.3 * s, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(0, 0.15 * s, 0.85 * s, 0.68 * s, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.arc(-0.38 * s, -0.5 * s, 0.17 * s, 0, Math.PI * 2); c.arc(0.38 * s, -0.5 * s, 0.17 * s, 0, Math.PI * 2); c.fill();
  eye(c, -0.36 * s, -0.5 * s, 0.08 * s); eye(c, 0.4 * s, -0.5 * s, 0.08 * s);
  c.beginPath(); c.arc(0, 0.12 * s, 0.4 * s, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
}
function drawBoat(c, s, col){            // кораблик: корпус-трапеция, мачта, белый парус
  c.fillStyle = col;
  c.beginPath(); c.moveTo(-0.95 * s, 0.2 * s); c.lineTo(0.95 * s, 0.2 * s); c.lineTo(0.6 * s, 0.7 * s); c.lineTo(-0.6 * s, 0.7 * s); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-0.05 * s, 0.2 * s); c.lineTo(-0.05 * s, -0.9 * s); c.stroke();
  c.fillStyle = PAL.white; c.beginPath(); c.moveTo(0.02 * s, -0.85 * s); c.lineTo(0.02 * s, 0.08 * s); c.lineTo(0.72 * s, 0.08 * s); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = col; c.beginPath(); c.moveTo(-0.12 * s, -0.85 * s); c.lineTo(-0.12 * s, -0.25 * s); c.lineTo(-0.62 * s, -0.25 * s); c.closePath(); c.fill(); c.stroke();
}
function drawStar(c, s, col){            // звезда: пять лучей и рожица
  c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 0.45 * s : 0.98 * s; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr + 0.06 * s); }
  c.closePath(); c.fill(); c.stroke();
  eye(c, -0.18 * s, 0, 0.08 * s); eye(c, 0.18 * s, 0, 0.08 * s);
  c.beginPath(); c.arc(0, 0.12 * s, 0.17 * s, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
}
// Значки механик поверх 3D (canvas-оверлей): замок — замочек в углу, крепкий — щит в углу, мутный — «?» на месте
// каждой игрушки (число видно, вид — нет). Читаются формой, не только цветом (§9).
function drawBadges(c, v, t){
  for (const q of v.valves) drawValveBadge(c, q);
  for (const b of v.bubbles){
    const bx = b.x + b.r * 0.66, by = b.y - b.r * 0.66;
    if (b.lock) drawLockBadge(c, bx, by, b.r, false);
    if (b.strong) drawStrongBadge(c, bx, by, b.r);
    if (b.murky && b.n){
      const ofs = SLOT_OFS[Math.min(3, b.n)], rs = b.r * TOY_BY_N[Math.min(3, b.n)] * 1.05;
      for (let k = 0; k < b.n; k++) drawQuestion(c, b.x + ofs[k][0] * b.r, b.y + ofs[k][1] * b.r, rs);
    }
  }
}
function badgeDisc(c, x, y, s, fill){ c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.fillStyle = fill; c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill(); c.stroke(); }
// Замочек: дужка и корпус с скважиной; open — дужка поднята и сдвинута (для эффекта «открылся»).
function drawLockBadge(c, x, y, r, open){
  const s = Math.max(10, r * 0.26);
  c.save(); badgeDisc(c, x, y, s, '#7a5af0');
  c.strokeStyle = '#fff'; c.lineWidth = s * 0.2; c.lineCap = 'round';
  c.beginPath(); c.arc(x + (open ? s * 0.28 : 0), y - s * (open ? 0.3 : 0.12), s * 0.3, Math.PI, Math.PI * 2); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(x - s * 0.45, y - s * 0.12, s * 0.9, s * 0.62, s * 0.12); c.fill();
  c.fillStyle = '#7a5af0'; c.beginPath(); c.arc(x, y + s * 0.15, s * 0.11, 0, Math.PI * 2); c.fill();
  c.restore();
}
// Щит крепкого пузыря.
function drawStrongBadge(c, x, y, r){
  const s = Math.max(10, r * 0.26);
  c.save(); badgeDisc(c, x, y, s, '#f08a1c');
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(x, y - s * 0.6); c.lineTo(x + s * 0.48, y - s * 0.38); c.lineTo(x + s * 0.4, y + s * 0.18);
  c.quadraticCurveTo(x + s * 0.2, y + s * 0.5, x, y + s * 0.62); c.quadraticCurveTo(x - s * 0.2, y + s * 0.5, x - s * 0.4, y + s * 0.18); c.lineTo(x - s * 0.48, y - s * 0.38); c.closePath(); c.fill();
  c.fillStyle = '#f08a1c'; c.fillRect(x - s * 0.06, y - s * 0.38, s * 0.12, s * 0.7); c.restore();
}
// Состояние краника на фланце: открыт — зелёный кружок со стрелкой в сторону потока, закрыт — красный «кирпич».
function drawValveBadge(c, v){
  const s = Math.max(7, GEO.r * VALVE_R * 0.42), x = v.x, y = v.y;
  c.save(); c.lineWidth = 1.5; c.strokeStyle = '#fff'; c.fillStyle = v.open ? '#2fb84f' : '#e8404b';
  c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#fff';
  if (v.open){ const d = v.dir; c.beginPath(); c.moveTo(x - d * s * 0.55, y - s * 0.18); c.lineTo(x + d * s * 0.05, y - s * 0.18); c.lineTo(x + d * s * 0.05, y - s * 0.48);
    c.lineTo(x + d * s * 0.62, y); c.lineTo(x + d * s * 0.05, y + s * 0.48); c.lineTo(x + d * s * 0.05, y + s * 0.18); c.lineTo(x - d * s * 0.55, y + s * 0.18); c.closePath(); c.fill(); }
  else c.fillRect(x - s * 0.58, y - s * 0.17, s * 1.16, s * 0.34);
  c.restore();
}
// «?» на месте спрятанной игрушки мутного пузыря.
function drawQuestion(c, x, y, s){
  c.save(); c.fillStyle = 'rgba(70,90,130,.55)'; c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; c.font = '900 ' + Math.round(s * 1.35) + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('?', x, y + s * 0.06); c.restore();
}
// 2D-запасные губка и краник (без WebGL).
function drawSponge2D(c, x, y, r){ c.fillStyle = '#ffd54a'; c.strokeStyle = '#c9971a'; c.lineWidth = 3; c.beginPath(); c.roundRect(x - r * 0.75, y - r * 0.5, r * 1.5, r, r * 0.18); c.fill(); c.stroke(); }
function drawValve2D(c, v){
  const r = GEO.r * VALVE_R; c.save(); c.fillStyle = '#dfe8ee'; c.strokeStyle = '#6b8796'; c.lineWidth = 3;
  c.beginPath(); c.arc(v.x, v.y, r, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = v.open ? '#3fbf55' : '#e8505b'; c.beginPath(); c.arc(v.x, v.y, r * 0.45, 0, Math.PI * 2); c.fill(); c.restore();
}
// Палец-подсказка: кольцо пульсирует над пузырём, кончик указывает на него.
function drawFinger(c, x, y, t){
  const k = 0.5 + 0.5 * Math.sin(t * 0.008), r = GEO.r;
  c.strokeStyle = PAL.accent; c.lineWidth = 3; c.globalAlpha = 0.9 - 0.5 * k;
  c.beginPath(); c.arc(x - r * 0.45, y - r * 0.35, r * (0.5 + 0.5 * k), 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1;
  c.save(); c.translate(x + k * 4, y + k * 4); c.rotate(-0.5);
  c.fillStyle = PAL.white; c.strokeStyle = PAL.outline; c.lineWidth = 2.5;
  c.beginPath(); c.roundRect(-7, -12, 14, 34, 7); c.fill(); c.stroke();
  c.beginPath(); c.roundRect(-13, 8, 28, 26, 9); c.fill(); c.stroke();
  c.restore();
}
// Эффекты в canvas (§9): брызги лопнувшего пузыря, улёт тройки, вспышка в стаканчике, всплывающий текст.
function drawFx(c, f, t){
  const p = Math.min(1, (t - f.t0) / (f.until - f.t0));
  if (f.type === 'pop'){
    c.strokeStyle = PAL.white; c.lineWidth = 3 * (1 - p); c.globalAlpha = 1 - p;
    c.beginPath(); c.arc(f.x, f.y, f.r * (1 + 0.45 * p), 0, Math.PI * 2); c.stroke();
    c.fillStyle = PAL.white;
    for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4 + f.chain, d = f.r * (1 + 0.8 * easeOut(p)); c.beginPath(); c.arc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 4 * (1 - p) + 1, 0, Math.PI * 2); c.fill(); }
    c.globalAlpha = 1;
  } else if (f.type === 'fly'){
    const y = f.y - 150 * easeIn(p), a = 1 - p;
    c.globalAlpha = a;
    drawBubbleBack(c, f.x, y, f.r, false);
    const ofs = SLOT_OFS[3];
    for (const o of ofs) drawToy(c, f.k, f.x + o[0] * f.r, y + o[1] * f.r, f.r * TOY_K);
    drawBubbleFront(c, f.x, y, f.r, false);
    c.fillStyle = PAL.accent;
    for (let i = 0; i < 6; i++){ const ang = i * 1.05 + p * 3, d = f.r * (1.1 + 0.6 * p); c.beginPath(); c.arc(f.x + Math.cos(ang) * d, y + Math.sin(ang) * d, 3, 0, Math.PI * 2); c.fill(); }
    c.globalAlpha = 1;
  } else if (f.type === 'clear'){
    c.globalAlpha = 1 - p; drawToy(c, f.k, f.x, f.y - 40 * p, f.s * (1 + 0.6 * p)); c.globalAlpha = 1;
  } else if (f.type === 'unlock'){
    c.save(); c.globalAlpha = 1 - p; drawLockBadge(c, f.x, f.y - 26 * easeOut(p), f.r * (1 + 0.3 * p), true); c.restore();
  } else if (f.type === 'text'){
    const pop = p < 0.18 ? 0.6 + 0.6 * (p / 0.18) : p < 0.3 ? 1.2 - 0.2 * ((p - 0.18) / 0.12) : 1;
    c.save(); c.globalAlpha = p < 0.75 ? 1 : 1 - (p - 0.75) / 0.25; c.translate(f.x, f.y - 34 * easeOut(p)); c.scale(pop, pop);
    c.font = (f.big ? '900 30' : '800 22') + 'px system-ui, -apple-system, sans-serif'; c.textAlign = 'center'; c.lineJoin = 'round';
    c.lineWidth = f.big ? 7 : 5; c.strokeStyle = f.big ? '#7a2fb8' : '#315b70'; c.strokeText(f.text, 0, 0);
    c.fillStyle = f.big ? '#ffe14d' : '#ffffff'; c.fillText(f.text, 0, 0); c.restore();
  }
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4) ---
let lastFrame = 0;
// Ошибка отрисовки не должна останавливать цикл (раньше rAF не перезаказывался — игра «застывала» кадром).
let renderErr = '';
function safeRender(){
  try { render(); }
  catch (e){ const m = String(e && e.stack || e).slice(0, 300); if (m !== renderErr){ renderErr = m; console.error(e); log('event', 'error', m); }
    if (G.ending && now() >= G.ending && !G.anim) try { finishEnding(); } catch (e2) {} }   // экран итога всё равно открыть
}
function frame(){ requestAnimationFrame(frame); lastFrame = performance.now(); if (!G.paused) safeRender(); }
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, прогон времени, автоигра ---
window.PENA_V_VANNE = {
  G, CFG, LEVELS,
  state(){
    if (!G.s) return { screen: G.screen };
    const el = (b) => (b.lock ? '#' : '') + (b.murky ? '?' : '') + (b.strong ? '!' : '') + (b.sp ? '*' : '') + (b.wc !== undefined ? '=' : '') + b.toys.map(t => 'ABCDEF'[t.k]).join('');
    const cols = G.s.cols.map(col => col.map(el).join(' ')).join(' | ');
    return { level: G.s.li + 1, cols, valves: G.s.valves.map(v => `${v.c}→${v.to}@${v.k}:${v.open ? 'open' : 'shut'}`).join(' '),
             cup: G.s.cup.map(t => 'ABCDEF'[t.k]).join(''), cap: G.s.cap, moves: G.s.moves, par: G.s.par, undos: G.save.undos, reviveUsed: G.reviveUsed,
             win: isWin(G.s), lose: isLose(G.s), why: G.s.why, animating: !!G.anim, screen: G.screen };
  },
  play(n, extraSlot){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1), extraSlot); return this.state(); },
  // Своя раскладка: столбики снизу вверх, префиксы '#' замок, '?' мутный, '!' крепкий, '*' губка, '=' широкий ('=AB' и '=' в соседних
  // столбиках ряда 0); valves — [[столбик, высота, куда, открыт]]. Пример: custom([['=AB', '#C', 'A'], ['=', '*', 'AB']], 3, [[0, 2, 1, true]])
  custom(rows, cap, valves){
    startLevel(0); G.s = layoutToState(0, parseLayout(rows, valves), cap || CFG.CUP_CAP, 0); clear3D(); G.maxH = fieldH();
    G.hintMove = -1; $('tip').textContent = ''; fit(); hud(); R3.foamKey = R3.cupKey = ''; return this.state(); },
  tap(c, i){ tapBubble(c, i); return this.state(); },
  tapValve(q){ tapValve(q || 0); return this.state(); },
  valveXY(q){ const v = valveXY(G.s.valves[q || 0]), r = $('cv').getBoundingClientRect(); return { x: r.left + v.x * scale, y: r.top + v.y * scale }; },   // экранные координаты краника (для касаний)
  bubbleXY(c, i){ const b = G.s.cols[c][i], q = b.wc !== undefined ? bubbleXY(b.wc + 0.5, 0) : bubbleXY(c, i), r = $('cv').getBoundingClientRect(); return { x: r.left + q.x * scale, y: r.top + q.y * scale }; },
  undo(){ useUndo(); return this.state(); },   // бустер (тратит запас; при нуле — предложение)
  rawUndo(){ undo(); return this.state(); },   // отмена без бустера (отладка)
  revive(){ doRevive(); return this.state(); },
  monet(){ return Object.assign({}, G.monet); },
  undos(n){ if (n !== undefined){ G.save.undos = n; save(); hud(); } return G.save.undos; },
  goto(screen, payload){ goto(screen, payload); return G.screen; },
  solve(){ return G.s ? (solve(G.s) || []).map(m => [m >> 4, m & 15]) : null; },
  auto(delayMs){ const path = this.solve() || []; path.forEach(([c, i], k) => setTimeout(() => tapBubble(c, i), (delayMs || 700) * (k + 1))); return path; },
  drive(sec){                                   // ручной прогон игрового времени: часы сдвигаются шагами по 16 мс
    const steps = Math.ceil(sec * 1000 / 16);
    for (let k = 0; k < steps; k++){ G.skew += 16; safeRender(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
fit(); init3D(); fit(); hud();
const startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
if (startHash === 'game') startLevel(G.save.level); else if (startHash === 'start') goto('start', G.save.level); else goto(startHash || 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length);
</script>
</body>
</html>
